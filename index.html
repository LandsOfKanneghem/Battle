<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поле волшебника</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <section class="arena" aria-label="Поле и очередь ходов">
      <div id="battlefield" aria-label="Поле боя 16 на 16 клеток"></div>
      <div id="turn-order" aria-label="Очередь ходов"></div>
    </section>
    <aside class="panel" aria-labelledby="character-name">
      <h1 id="character-name">Волшебник</h1>
      <div class="stats" aria-live="polite" aria-atomic="true">
        <section class="stat-column"><h2>Основные</h2>
          <span id="ap"></span>
          <span id="mp"></span>
          <span id="hp"></span>
          <span id="ra"></span>
          <span id="wp"></span>
          <span id="vs"></span>
          <span id="es"></span>
        </section>
        <section class="stat-column"><h2>Атрибуты</h2>
          <span id="vit"></span>
          <span id="str"></span>
          <span id="att"></span>
          <span id="int"></span>
          <span id="wis"></span>
          <span id="cha"></span>
          <span id="luc"></span>
        </section>
        <section class="stat-column"><h2>Сопротивления</h2>
          <span class="resistance-stat" title="Броня" aria-label="Броня"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1 L6 2 Q8 5 10 2 L13 1 L15 5 L12 7 L13 14 Q8 16 3 14 L4 7 L1 5 Z" fill="#aebaca" stroke="#596879" stroke-width=".7"/><path d="M4 3 L5 7 M12 3 L11 7 M8 5 V14 M4 10 L8 11 L12 10" fill="none" stroke="#e1e7ed" stroke-width=".8"/></svg><span id="res-ac"></span></span>
          <span class="resistance-stat" title="Физика" aria-label="Физика"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 L8 1 L13 2 V8 Q12 12 8 15 Q4 12 3 8 Z" fill="#b4c1d3"/><path d="M8 3 V12" stroke="#65728a"/></svg><span id="res-physical"></span></span>
          <span class="resistance-stat" title="Огонь" aria-label="Огонь"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q9 6 13 7 Q17 14 8 15 Q0 15 2 8 L5 3 L5 9 Q9 7 8 1" fill="#ff853e"/></svg><span id="res-fire"></span></span>
          <span class="resistance-stat" title="Вода" aria-label="Вода"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q3 7 3 10 A5 5 0 0 0 13 10 Q13 7 8 1" fill="#6fbaff"/><path d="M5 10 Q5 12 7 12" fill="none" stroke="#d0efff"/></svg><span id="res-water"></span></span>
          <span class="resistance-stat" title="Воздух" aria-label="Воздух"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5 H10 Q15 5 13 2 Q11 0 9 3 M1 9 H12 Q16 9 14 13 Q12 16 10 13 M2 13 H6" stroke="#b7eeeb" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span id="res-air"></span></span>
          <span class="resistance-stat" title="Земля" aria-label="Земля"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 14 L6 3 L9 8 L12 5 L15 14 Z" fill="#c59b67"/><path d="M6 3 L4 8 H8 Z" fill="#eee0c4"/></svg><span id="res-earth"></span></span>
          <span class="resistance-stat" title="Разум" aria-label="Разум"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8 Q8 -1 15 8 Q8 17 1 8 Z" fill="#ba9bec"/><circle cx="8" cy="8" r="3" fill="#423163"/><circle cx="9" cy="7" r="1" fill="#ece5ff"/></svg><span id="res-mind"></span></span>
          <span class="resistance-stat" title="Яд" aria-label="Яд"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q3 7 3 10 A5 5 0 0 0 13 10 Q13 7 8 1" fill="#91cf69"/><circle cx="6" cy="10" r="1" fill="#29452c"/><circle cx="10" cy="10" r="1" fill="#29452c"/><path d="M6 13 H10" stroke="#29452c"/></svg><span id="res-poison"></span></span>
        </section>
        <section class="stat-column"><h2>Бой</h2>
          <span id="acc"></span>
          <span id="sfc"></span>
          <span id="eva"></span>
          <span id="blo"></span>
          <span id="ini"></span>
        </section>
      </div>
      <button id="end-turn" type="button">Передать ход</button>
      <div id="spells" class="spells" aria-label="Заклинания"></div>
      <div id="spell-pages" class="spell-pages" aria-label="Переключение страниц заклинаний" hidden>
        <button id="spell-page-prev" type="button" aria-label="Предыдущая страница заклинаний">←</button>
        <button id="spell-page-next" type="button" aria-label="Следующая страница заклинаний">→</button>
      </div>
      <div id="effects-panel" class="effects-panel" aria-label="Эффекты выбранного существа" hidden>
        <button id="close-effects" class="close-effects" type="button" aria-label="Закрыть эффекты">×</button>
        <section><h2>Заклинания</h2><div id="spell-effects" class="effect-grid"></div></section>
        <section><h2>Состояния</h2><div id="state-effects" class="effect-grid"></div></section>
      </div>
    </aside>
  </main>
  <script src="data/states.js"></script>
  <script src="data/spellData.js"></script>
  <script src="data/creatures.js"></script>
  <script src="gameState.js"></script>
  <script src="init.js"></script>
  <script src="combat.js"></script>
  <script src="spellLogic.js"></script>
  <script src="animations.js"></script>
  <script src="ui.js"></script>
  <script src="spellTargeting.js"></script>
  <script src="movement.js"></script>
  <script>
    gameState.previousSpellPageButton.addEventListener('click', () => window.changeSpellPage(-1));
    gameState.nextSpellPageButton.addEventListener('click', () => window.changeSpellPage(1));

    window.addEventListener('resize', window.hideSpellTooltip);
    window.addEventListener('scroll', window.hideSpellTooltip, true);

    // Проверка в консоли: gameState.entities.find(e => e.id === gameState.activeEntityId).hp = 0;
    // window.removeDefeatedEntities(); // Следующий участник должен стать активным сразу.

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && gameState.preparedSpellId) window.cancelSpell();
    });

    for (const id of gameState.turnOrderIds) {
      const entity = gameState.entities.find(item => item.id === id);
      if (!entity) continue;
      const slot = gameState.turnSlots.get(id);
      slot.addEventListener('contextmenu', event => {
        event.preventDefault();
        window.selectEntity(entity.id);
      });
      slot.addEventListener('mouseenter', () => {
        gameState.queueHoveredEntityId = entity.id;
        window.updatePanel();
      });
      slot.addEventListener('mouseleave', () => {
        gameState.queueHoveredEntityId = null;
        window.updatePanel();
      });
    }
    gameState.turnOrder.addEventListener('mouseleave', () => {
      gameState.queueHoveredEntityId = null;
      window.updatePanel();
    });

    function renderPosition() {
      // Перенос DOM-элемента мгновенный: никаких CSS-переходов.
      for (const entity of gameState.entities) {
        gameState.cells[entity.position.y * gameState.SIZE + entity.position.x].appendChild(entity.svg);
      }
    }

    window.addEventListener('resize', window.hideEffectTooltip);
    window.addEventListener('scroll', window.hideEffectTooltip);

    document.getElementById('close-effects').addEventListener('click', () => {
      gameState.selectedEntityId = null;
      window.updatePanel();
    });
    gameState.battlefield.addEventListener('contextmenu', event => {
      event.preventDefault();
      const cell = event.target.closest('.cell');
      if (!cell || !gameState.battlefield.contains(cell)) return;
      const entity = gameState.entities.find(item => item.hp > 0 && item.position.x === Number(cell.dataset.x)
        && item.position.y === Number(cell.dataset.y));
      if (entity) window.selectEntity(entity.id);
    });

    gameState.endTurnButton.addEventListener('click', () => {
      if (gameState.isCasting || gameState.isSkippingTurn || isFrozen(gameState.activeEntity())) return;
      if (gameState.isMoving || ![character.id, monk.id].includes(gameState.activeEntityId)) return;
      window.beginTurn(gameState.nextLivingEntity(gameState.activeEntityId));
    });

    gameState.battlefield.addEventListener('mousemove', (event) => {
      if (gameState.isCasting) return;
      const cell = event.target.closest('.cell');
      if (!cell || !gameState.battlefield.contains(cell)) {
        gameState.fieldHoveredEntityId = null;
        window.updatePanel();
        if (gameState.preparedSpellId) window.highlightSpellRange();
        else window.clearHighlight(); // В том числе при наведении на промежуток сетки.
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      gameState.fieldHoveredEntityId = gameState.entities.find(entity => gameState.keyOf(entity.position) === gameState.keyOf(target))?.id ?? null;
      window.updatePanel();
      const mover = window.activeMover();
      if (gameState.isMoving || !mover) return;
      if (gameState.preparedSpellId) {
        const spell = gameState.activeEntity()?.spells.find(item => item.id === gameState.preparedSpellId);
        if (spell) {
          const key = `spell:${gameState.keyOf(target)}`;
          if (gameState.previewKey !== key) {
            window.highlightSpellRange(window.canTarget(target, spell) ? target : null);
            gameState.previewKey = key;
          }
        }
        return;
      }
      // Повторные события в одной клетке не запускают A* заново.
      // Позиция и MP включены в ключ, чтобы не использовать устаревшее превью.
      const key = `${mover.id}:${gameState.keyOf(target)}:${gameState.keyOf(mover.position)}:${mover.mp}`;
      if (gameState.previewKey === key) return;
      window.clearHighlight();
      // Стоимость нужна только для свободного места назначения.
      // Даже свой персонаж занимает клетку: число под ним не показываем.
      if (!gameState.isFree(target) || gameState.entities.some(entity => gameState.keyOf(entity.position) === gameState.keyOf(target))) {
        gameState.previewKey = key;
        return;
      }
      const path = window.buildPath(mover.position, target);
      if (path) window.highlightPath(path, mover.mp);
      gameState.costLabel.textContent = path === null ? '∞' : String(gameState.pathCost(path));
      cell.appendChild(gameState.costLabel);
      gameState.previewKey = key;
    });

    gameState.battlefield.addEventListener('mouseleave', () => {
      if (gameState.preparedSpellId) window.highlightSpellRange();
      else window.clearHighlight();
      gameState.fieldHoveredEntityId = null;
      window.updatePanel();
    });

    gameState.battlefield.addEventListener('click', (event) => {
      if (gameState.isCasting) return;
      // Новая цель не прерывает уже начатый маршрут.
      const mover = window.activeMover();
      if (gameState.isMoving || !mover) return;
      const cell = event.target.closest('.cell');
      if (!cell || !gameState.battlefield.contains(cell)) return;
      if (gameState.preparedSpellId) {
        castSpell(cell, spellDeps);
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      if (!gameState.isFree(target)) return;
      const path = window.buildPath(mover.position, target);
      // Недоступный маршрут игнорируем, сохраняя текущее превью.
      if (mover.mp <= 0 || path === null || gameState.pathCost(path) > mover.mp) return;
      if (path.length === 0) return;
      window.clearHighlight();
      gameState.fieldHoveredEntityId = null;
      gameState.stepQueue = path;
      gameState.isMoving = true;
      gameState.battlefield.classList.add('moving');
      window.updatePanel();
      setTimeout(window.takeStep, gameState.STEP_MS);
    });

    // Ссылки создаются после объявления всех обработчиков и до инициализации интерфейса.
    const spellDeps = {
      stateTypes,
      WIZARD_SPELLS, MONK_SPELLS, FREEZE, HEAVY, ADRENALINE, VIGOR, WEAKNESS,
      applyState: window.applyState, applyDamage: window.applyDamage,
      applySpellOnEntity: window.applySpellOnEntity, hasActiveState: window.hasActiveState,
      isFrozen: window.isFrozen, shotHits: window.shotHits, spellDamage: window.spellDamage,
      getEffectiveStat: window.getEffectiveStat,
      addElementalShield: window.addElementalShield,
      resolveStateSuppression: window.resolveStateSuppression, recalculateStateStats: window.recalculateStateStats,
      updatePanel: window.updatePanel,
      removeDefeatedEntities: window.removeDefeatedEntities, renderPosition,
      cancelSpell: window.cancelSpell, clearHighlight: window.clearHighlight,
      playMissAnimation: window.playMissAnimation,
      playFailureAnimation: window.playFailureAnimation,
      playProjectileAnimation: window.playProjectileAnimation,
      playSparksAnimation: window.playSparksAnimation,
      playCubeExplosion: window.playCubeExplosion,
      playArmageddonAnimation: window.playArmageddonAnimation,
      playRainAnimation: window.playRainAnimation,
      playWeaknessVigorAnimation: window.playWeaknessVigorAnimation,
      playSkyShotAnimation: window.playSkyShotAnimation,
      playHeavyAnimation: window.playHeavyAnimation,
      playStateAnimation: window.playStateAnimation,
      playLightFlashAnimation: window.playLightFlashAnimation,
      playMembraneAnimation: window.playMembraneAnimation,
      playBurningHandsAnimation: window.playBurningHandsAnimation,
      playWindRoseAnimation: window.playWindRoseAnimation,
      playElementalShieldAnimation: window.playElementalShieldAnimation,
      playFreezeAnimation: window.playFreezeAnimation,
      playHealAnimation: window.playHealAnimation,
      playHealHarmAnimation: window.playHealHarmAnimation,
      playSprintAnimation: window.playSprintAnimation,
      hasSkyShotBuff: window.hasSkyShotBuff,
      effectiveSpellRange: window.effectiveSpellRange,
      inSpellReach: window.inSpellReach,
      canTarget: window.canTarget,
      canPrepareSpell: window.canPrepareSpell,
      getConeCells, getBlockedConeCells, findSparkTargets, affectedCells, applySpellEffect,
      setTimeout, queueMicrotask,
    };

    renderPosition();
    window.renderSpellPanel();
    window.updatePanel();
    // На мобильном остаток высоты отдаётся полю; длинная панель прокручивается сама.
    new ResizeObserver(([entry]) => {
      document.documentElement.style.setProperty('--panel-height', `${Math.ceil(entry.target.getBoundingClientRect().height)}px`);
    }).observe(document.querySelector('.panel'));
  </script>
</body>
</html>
