<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поле волшебника</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a1a1a;
      display: grid;
      place-items: center;
      color: #f1f3f7;
      font-family: system-ui, sans-serif;
    }
    .game {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .arena { display: flex; flex-direction: column; gap: 12px; }
    #turn-order { display: flex; gap: 8px; padding: 6px; background: #262b33; border-radius: 6px; }
    .turn-slot { width: 44px; height: 44px; padding: 3px; border: 2px solid transparent; border-radius: 5px; background: #343b46; }
    .turn-slot.active { background: #606c80; border-color: #ffdc36; }
    .cell.entity-hover { outline: 2px solid #ffdc36; outline-offset: -2px; }
    .panel {
      width: 200px;
      padding: 20px;
      background: #262b33;
      border: 1px solid #515966;
      border-radius: 10px;
    }
    .spells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; }
    .spell-slot { aspect-ratio: 1; min-width: 0; padding: 3px; background: #191e26; border: 2px solid #515966; border-radius: 4px; }
    button.spell-slot { cursor: pointer; }
    .spell-slot svg { display: block; width: 100%; height: 100%; pointer-events: none; }
    .spell-slot.prepared { border-color: #ffdc36; }
    .spell-slot:disabled { opacity: .4; cursor: default; }
    .panel h1 { font-size: 20px; margin: 0 0 16px; }
    .stats { display: grid; gap: 8px; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
    #end-turn {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #ffdc36;
      color: #20202b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #end-turn:hover:not(:disabled) { background: #ffea85; }
    #end-turn:focus-visible { outline: 3px solid #86e8ff; outline-offset: 3px; }
    #end-turn:disabled { opacity: 0.45; cursor: wait; }
    #battlefield {
      /* Запас по краям; dvh учитывает панели мобильного браузера. */
      width: min(calc(100vw - 248px), calc(96vh - 68px));
      width: min(calc(100vw - 248px), calc(96dvh - 68px));
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      grid-template-rows: repeat(16, minmax(0, 1fr));
      gap: 1px;
      padding: 1px;
      background: #b8b8b8;
    }
    @media (max-width: 640px) {
      .game { flex-direction: column; gap: 12px; }
      #battlefield {
        width: min(96vw, calc(100vh - 410px));
        width: min(96vw, calc(100dvh - 410px));
      }
      .panel { width: 96vw; padding: 12px; }
      .spells { width: 148px; margin: 10px auto 0; }
      .panel h1 { margin-bottom: 8px; font-size: 18px; }
      .stats { grid-template-columns: repeat(3, auto); gap: 8px; margin-bottom: 10px; }
    }
    .cell {
      position: relative;
      isolation: isolate;
      min-width: 0;
      min-height: 0;
      background: #30343b;
      cursor: pointer;
    }
    .cell:hover { background: #424954; }
    /* Цвет лежит в фоне клетки, под SVG и внутри линий сетки. */
    .terrain { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .terrain svg { display: block; width: 100%; height: 100%; }
    /* Поверх поверхности, но под существами: прозрачная заливка не скрывает SVG. */
    .cell::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    #battlefield .obstacle, #battlefield .wizard, #battlefield .phoenix, #battlefield .monk {
      position: absolute; inset: 0; z-index: 3;
    }
    .path-cost {
      position: absolute; top: 1px; right: 1px; z-index: 2;
      color: #edb4ff; background: rgba(26, 12, 40, .85); border-radius: 3px;
      padding: 0 3px; font-size: clamp(9px, 1.4vmin, 14px); line-height: 1.3;
      font-weight: 700; pointer-events: none;
    }
    .effect-preview {
      position: absolute; top: 1px; right: 1px; z-index: 4;
      padding: 0 3px; border-radius: 3px; background: rgba(20, 20, 25, .85);
      font-size: clamp(9px, 1.4vmin, 14px); line-height: 1.3;
      font-weight: 700; pointer-events: none;
    }
    .effect-preview.damage { color: #ff8585; }
    .effect-preview.heal { color: #83efac; }
    .cell.spell-aoe::after { box-shadow: inset 0 0 0 2px rgba(100, 200, 255, 0.8); }
    .cell.spell-range::after, .cell.path-reachable::after {
      background-image: linear-gradient(rgba(80, 220, 120, 0.35), rgba(80, 220, 120, 0.35));
    }
    .cell.path-over-budget::after {
      background-image: linear-gradient(rgba(220, 80, 80, 0.35), rgba(220, 80, 80, 0.35));
    }
    #battlefield.moving .cell { cursor: wait; }
    .cell.blocked { cursor: not-allowed; }
    .obstacle, .wizard, .phoenix, .monk { display: block; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <main class="game">
    <section class="arena" aria-label="Поле и очередь ходов">
      <div id="battlefield" aria-label="Поле боя 16 на 16 клеток"></div>
      <div id="turn-order" aria-label="Очередь ходов"></div>
    </section>
    <aside class="panel" aria-labelledby="character-name">
      <h1 id="character-name">Волшебник</h1>
      <div class="stats" aria-live="polite" aria-atomic="true">
        <span id="hp"></span>
        <span id="ap"></span>
        <span id="mp"></span>
      </div>
      <button id="end-turn" type="button">Передать ход</button>
      <div id="spells" class="spells" aria-label="Заклинания"></div>
    </aside>
  </main>
  <script>
    const SIZE = 16;
    const STEP_MS = 90;
    const battlefield = document.getElementById('battlefield');
    const cells = [];
    // Полная карта поверхностей независима от ящиков.
    const terrain = new Map();
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      terrain.set(`${x},${y}`, x >= 9 && x <= 12 && y >= 5 && y <= 11 ? 'sand' : 'grass');
    }
    const waterCells = [[5,7], [5,8], [6,8], [10,12], [11,12]];
    // Остров (14,14): восемь водных клеток делают его недоступным пешком.
    for (let y = 13; y <= 15; y++) for (let x = 13; x <= 15; x++) {
      if (x !== 14 || y !== 14) waterCells.push([x, y]);
    }
    for (const [x,y] of waterCells) terrain.set(`${x},${y}`, 'deep-water');
    const obstacles = new Map([
      ['3,3', 'crate'], ['4,4', 'crate'], ['7,6', 'crate'],
      ['11,10', 'crate'], ['12,4', 'crate'], ['4,12', 'crate'], ['15,15', 'crate']
    ]);
    const keyOf = ({ x, y }) => `${x},${y}`;
    const entryCost = point => ({ grass: 1, sand: 2, 'deep-water': Infinity })[terrain.get(keyOf(point))] ?? Infinity;
    const pathCost = path => path.reduce((cost, point) => cost + entryCost(point), 0);
    const isFree = ({ x, y }) => x >= 0 && x < SIZE && y >= 0 && y < SIZE
      && Number.isFinite(entryCost({ x, y })) && obstacles.get(`${x},${y}`) !== 'crate'
      && !entities.some(entity => entity.id !== activeEntityId && entity.position.x === x && entity.position.y === y);

    const terrainArt = {
      grass: `<rect width="40" height="40" fill="#304c36"/><path d="M7 15 L5 10 M7 15 L9 8 M27 32 L25 26 M27 32 L30 24 M19 12 V7" stroke="#62825a" fill="none"/>`,
      sand: `<rect width="40" height="40" fill="#a18b59"/><path d="M5 12 Q10 9 15 12 M23 29 Q28 26 35 29" stroke="#d4bd82" fill="none"/><g fill="#77623b"><circle cx="25" cy="8" r="1"/><circle cx="10" cy="30" r="1"/><circle cx="20" cy="20" r="1"/></g>`,
      'deep-water': `<rect width="40" height="40" fill="#1251a0"/><path d="M3 10 Q7 6 11 10 T19 10 T27 10 T37 10 M3 21 Q7 17 11 21 T19 21 T27 21 T37 21 M3 32 Q7 28 11 32 T19 32 T27 32 T37 32" fill="none" stroke="#6ecfff" stroke-width="2"/>`
    };
    function createTerrain(type) {
      const layer = document.createElement('div');
      layer.className = 'terrain';
      layer.setAttribute('aria-hidden', 'true');
      layer.innerHTML = `<svg viewBox="0 0 40 40" preserveAspectRatio="none">${terrainArt[type]}</svg>`;
      return layer;
    }
    function createObstacle() {
      const sprite = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      sprite.setAttribute('viewBox', '0 0 40 40');
      sprite.setAttribute('class', 'obstacle');
      sprite.setAttribute('role', 'img');
      sprite.setAttribute('aria-label', 'Ящик');
      sprite.innerHTML = `<rect x="4" y="4" width="32" height="32" rx="2" fill="#925c32" stroke="#d5a36a" stroke-width="2"/><path d="M6 13 H34 M6 26 H34" stroke="#57351e" stroke-width="2"/><path d="M7 7 L33 33 M33 7 L7 33" stroke="#d5a36a" stroke-width="4"/>`;
      return sprite;
    }

    // HP постоянен между ходами; AP и MP — расходуемые ресурсы хода.
    const character = {
      id: 'wizard', name: 'Волшебник', type: 'wizard', hp: 10, maxHP: 10, spells: [],
      maxAP: 8, ap: 8, maxMP: 5, mp: 5,
      position: { x: 8, y: 8 }
    };
    const phoenix = {
      id: 'phoenix', name: 'Феникс', type: 'phoenix', hp: 8, maxHP: 8, spells: [],
      maxAP: 1, ap: 1, maxMP: 4, mp: 4,
      position: { x: 3, y: 4 }
    };
    const secondPhoenix = {
      id: 'phoenix-2', name: 'Феникс', type: 'phoenix', hp: 8, maxHP: 8, spells: [],
      maxAP: 1, ap: 1, maxMP: 4, mp: 4,
      position: { x: 7, y: 7 }
    };
    const monk = {
      id: 'monk', name: 'Монах', type: 'monk', hp: 10, maxHP: 10, spells: [],
      maxAP: 8, ap: 8, maxMP: 5, mp: 5,
      position: { x: 7, y: 8 }
    };
    const entities = [character, phoenix, secondPhoenix, monk];
    // Порядок ходов не зависит от порядка хранения и удаления существ.
    const turnOrderIds = ['wizard', 'phoenix', 'monk', 'phoenix-2'];

    function nextLivingEntity(afterId) {
      const index = turnOrderIds.indexOf(afterId);
      for (let offset = 1; offset <= turnOrderIds.length; offset++) {
        const id = turnOrderIds[(index + offset) % turnOrderIds.length];
        const entity = entities.find(item => item.id === id && item.hp > 0);
        if (entity) return entity;
      }
      return null;
    }
    let activeEntityId = character.id;
    let turnVersion = 0; // Защита от таймеров предыдущего хода.
    let hoveredEntityId = null;
    // Источники наведения разделены: очередь имеет приоритет над полем.
    let fieldHoveredEntityId = null;
    let queueHoveredEntityId = null;
    const turnOrder = document.getElementById('turn-order');
    const turnSlots = new Map();
    const endTurnButton = document.getElementById('end-turn');
    let stepQueue = [];
    let isMoving = false;
    let highlightedCells = [];
    let rangeHighlightedCells = [];
    let effectBadges = [];
    let previewKey = null;
    const costLabel = document.createElement('span');
    costLabel.className = 'path-cost';

    character.spells = [{
      id: 'fire-shot', name: 'Огненный выстрел', damage: 3,
      range: 6, apCost: 3, maxUsesPerTurn: 2, usesThisTurn: 0,
      cooldown: 0, maxCooldown: 0, isAOE: false, aoeSize: 1,
      svg: `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2 Q24 14 32 17 Q40 29 28 36 Q10 43 6 29 Q3 20 13 12 L12 24 Q22 19 20 2" fill="#f65a25"/><path d="M22 17 Q35 34 21 35 Q11 34 15 25 L19 28 Z" fill="#ffdc36"/></svg>`
    }, {
      id: 'fire-cube', name: 'Огненный куб', damage: 6,
      range: 5, apCost: 4, maxUsesPerTurn: 1, usesThisTurn: 0,
      cooldown: 0, maxCooldown: 2, isAOE: true, aoeSize: 3,
      svg: `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 24 Q0 14 8 3 L12 12 L20 1 L25 12 L34 4 Q42 19 35 31" fill="#f65a25"/><path d="M8 17 L20 10 L33 17 L33 31 L20 38 L8 31 Z" fill="#ff9d28" stroke="#ffdc36" stroke-width="2"/><path d="M8 17 L20 24 L33 17 M20 24 V38" fill="none" stroke="#ffe995" stroke-width="2"/></svg>`
    }];
    // Все поля заклинания — примитивы, включая SVG-разметку, поэтому
    // копия куба имеет независимые изменяемые cooldown и usesThisTurn.
    monk.spells = [{ ...character.spells.find(spell => spell.id === 'fire-cube') }, {
      id: 'heal', name: 'Лечение', healAmount: 5, isHeal: true,
      range: 5, minRange: 0, apCost: 2, maxUsesPerTurn: 1, usesThisTurn: 0,
      // Одноклеточная зона использует те же два слоя подсветки, что и куб.
      cooldown: 0, maxCooldown: 1, isAOE: true, aoeSize: 1,
      svg: `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="#164a36" stroke="#83efac"/><path d="M15 8 H25 V15 H32 V25 H25 V32 H15 V25 H8 V15 H15 Z" fill="#74ef9e"/></svg>`
    }];

    function activeEntity() {
      return entities.find(entity => entity.id === activeEntityId);
    }

    let preparedSpellId = null;
    const spellSlots = new Map();
    // Ключ — объект, поэтому одноимённые кубы разных владельцев не пересекаются.
    function renderSpellPanel() {
      document.getElementById('spells').replaceChildren();
      spellSlots.clear();
      const currentSpells = activeEntity()?.spells ?? [];
      for (const spell of currentSpells) {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'spell-slot';
        slot.innerHTML = spell.svg;
        slot.setAttribute('aria-label', spell.name);
        slot.addEventListener('click', () => {
          if (!canPrepareSpell(spell)) return;
          preparedSpellId = spell.id;
          highlightSpellRange();
          updatePanel();
        });
        spellSlots.set(spell, slot);
        document.getElementById('spells').appendChild(slot);
      }
      for (let i = currentSpells.length; i < 16; i++) {
        const slot = document.createElement('div');
        slot.className = 'spell-slot';
        document.getElementById('spells').appendChild(slot);
      }

    }

    function canPrepareSpell(spell) {
      const caster = activeEntity();
      return !!spell && !!caster && caster.hp > 0 && caster.spells.includes(spell) && !isMoving
        && caster.ap >= spell.apCost && spell.usesThisTurn < spell.maxUsesPerTurn
        && spell.cooldown === 0;
    }

    // Supercover от центра до центра с исключением для углов при 45°. Сравниваем моменты
    // пересечения границ целыми числами, без погрешностей float.
    function checkLOS(from, to) {
      const dx = Math.abs(to.x - from.x), dy = Math.abs(to.y - from.y);
      const sx = Math.sign(to.x - from.x), sy = Math.sign(to.y - from.y);
      let x = from.x, y = from.y;
      let crossedX = 0, crossedY = 0;

      function blocked(cx, cy) {
        if (obstacles.get(`${cx},${cy}`) === 'crate') return true;
        // Существо в исходной или целевой клетке не закрывает выстрел.
        if ((cx === from.x && cy === from.y) || (cx === to.x && cy === to.y)) return false;
        return entities.some(entity => entity.position.x === cx && entity.position.y === cy);
      }

      if (blocked(x, y)) return false;
      while (x !== to.x || y !== to.y) {
        const nextX = (2 * crossedX + 1) * dy;
        const nextY = (2 * crossedY + 1) * dx;
        if (nextX === nextY) {
          // Только при точных 45° разрешаем касание углов боковых клеток.
          // Диагональную клетку по-прежнему проверяем на препятствия.
          if (dx !== dy && (blocked(x + sx, y) || blocked(x, y + sy))) return false;
          x += sx;
          y += sy;
          crossedX++;
          crossedY++;
        } else if (nextX < nextY) {
          x += sx;
          crossedX++;
        } else {
          y += sy;
          crossedY++;
        }
        if (blocked(x, y)) return false;
      }
      return true;
    }

    function inSpellReach(target, spell) {
      const caster = activeEntity();
      if (!caster || !spell || !caster.spells.includes(spell)) return false;
      const distance = Math.abs(target.x - caster.position.x) + Math.abs(target.y - caster.position.y);
      return target.x >= 0 && target.x < SIZE && target.y >= 0 && target.y < SIZE
        && (spell.isHeal || !obstacles.has(keyOf(target)))
        && distance >= (spell.isHeal ? 0 : (spell.minRange ?? 1)) && distance <= spell.range
        && (distance === 0 || checkLOS(caster.position, target));
    }

    const isAlly = entity => entity.type === 'wizard' || entity.type === 'monk';

    function canTarget(target, spell) {
      // Доступность клетки не зависит от наличия существа: эффект
      // определяется отдельно при касте (в том числе лечение в пустоту).
      return inSpellReach(target, spell);
    }

    function affectedCells(center, spell) {
      const points = [];
      const radius = Math.floor(spell.aoeSize / 2);
      for (let y = center.y - radius; y <= center.y + radius; y++) {
        for (let x = center.x - radius; x <= center.x + radius; x++) {
          if (x >= 0 && x < SIZE && y >= 0 && y < SIZE) points.push({ x, y });
        }
      }
      return points;
    }

    function highlightSpellRange(center = null) {
      clearHighlight();
      const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
      if (!spell) return;
      // Зелёный фон — допустимые центры; голубая обводка — зона удара.
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
        if (!canTarget({ x, y }, spell)) continue;
        const cell = cells[y * SIZE + x];
        // Дальность одинакова для всех заклинаний; размер зоны задаёт aoeSize.
        cell.classList.add('spell-range');
        rangeHighlightedCells.push(cell);
      }
      if (center && canTarget(center, spell)) {
        const area = affectedCells(center, spell);
        for (const point of area) {
          const cell = cells[point.y * SIZE + point.x];
          cell.classList.add('spell-aoe');
          highlightedCells.push(cell);
        }
        showEffectPreview(area, spell);
      }
    }

    function showEffectPreview(area, spell) {
      const keys = new Set(area.map(keyOf));
      for (const entity of entities) {
        if (entity.hp <= 0 || !keys.has(keyOf(entity.position))) continue;
        if (spell.isHeal && !isAlly(entity)) continue;
        // Показываем полную величину эффекта, не ограничивая её текущим HP.
        const badge = document.createElement('span');
        badge.className = `effect-preview ${spell.isHeal ? 'heal' : 'damage'}`;
        badge.textContent = spell.isHeal ? `+${spell.healAmount}` : `-${spell.damage}`;
        cells[entity.position.y * SIZE + entity.position.x].appendChild(badge);
        effectBadges.push(badge);
      }
    }

    function cancelSpell() {
      preparedSpellId = null;
      clearHighlight();
      updatePanel();
    }

    function castSpell(targetCell) {
      const target = { x: Number(targetCell.dataset.x), y: Number(targetCell.dataset.y) };
      const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
      if (!canPrepareSpell(spell) || !canTarget(target, spell)) return false;
      const healTarget = spell.isHeal
        ? entities.find(entity => entity.hp > 0 && isAlly(entity)
          && keyOf(entity.position) === keyOf(target)) : null;
      // Дальность подсвечивается целиком, но лечение требует живого союзника.
      // Недопустимый клик сохраняет подготовку и не меняет ресурсы.
      if (spell.isHeal && !healTarget) return false;
      const caster = activeEntity();
      if (spell.isHeal) {
        healTarget.hp = Math.min(healTarget.maxHP ?? healTarget.hp, healTarget.hp + spell.healAmount);
      } else {
        const area = new Set(affectedCells(target, spell).map(keyOf));
        for (const victim of entities) {
          if (area.has(keyOf(victim.position)) && (spell.isAOE || victim.id !== caster.id)) {
            victim.hp = Math.max(0, victim.hp - spell.damage);
          }
        }
      }
      // Оплачиваем каст до удаления погибших: АОЕ может убить самого заклинателя
      // и немедленно передать ход следующему участнику.
      caster.ap -= spell.apCost;
      spell.usesThisTurn++;
      spell.cooldown = spell.maxCooldown;
      cancelSpell();
      removeDefeatedEntities();
      return true;
    }

    function removeDefeatedEntities() {
      const activeIndex = entities.findIndex(entity => entity.id === activeEntityId);
      const activeDied = activeIndex !== -1 && entities[activeIndex].hp <= 0;
      // Удаляем именно сущность по ID: одинаковые имена не связывают врагов.
      for (let i = entities.length - 1; i >= 0; i--) {
        const entity = entities[i];
        if (entity.hp > 0) continue;
        entity.svg.remove();
        turnSlots.get(entity.id).remove();
        turnSlots.delete(entity.id);
        if (hoveredEntityId === entity.id) hoveredEntityId = null;
        if (fieldHoveredEntityId === entity.id) fieldHoveredEntityId = null;
        if (queueHoveredEntityId === entity.id) queueHoveredEntityId = null;
        entities.splice(i, 1);
      }
      if (activeDied || entities.length === 0) {
        isMoving = false;
        stepQueue = [];
        battlefield.classList.remove('moving');
        beginTurn(nextLivingEntity(activeEntityId)); // Смена активного участника происходит сразу.
      } else {
        updatePanel();
      }
    }
    // Проверка в консоли: entities.find(e => e.id === activeEntityId).hp = 0;
    // removeDefeatedEntities(); // Следующий участник должен стать активным сразу.

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && preparedSpellId) cancelSpell();
    });

    function clearHighlight() {
      for (const badge of effectBadges) badge.remove();
      effectBadges = [];
      for (const cell of highlightedCells) {
        cell.classList.remove('path-reachable', 'path-over-budget', 'spell-aoe');
      }
      highlightedCells = [];
      for (const cell of rangeHighlightedCells) cell.classList.remove('spell-range');
      rangeHighlightedCells = [];
      previewKey = null;
      costLabel.remove();
    }

    function highlightPath(path, mp) {
      clearHighlight();
      let cost = 0;
      path.forEach(point => {
        cost += entryCost(point);
        const cell = cells[point.y * SIZE + point.x];
        cell.classList.add(cost <= mp ? 'path-reachable' : 'path-over-budget');
        highlightedCells.push(cell);
      });
    }

    const wizard = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    wizard.setAttribute('viewBox', '0 0 40 40');
    wizard.setAttribute('class', 'wizard');
    wizard.setAttribute('role', 'img');
    wizard.setAttribute('aria-label', 'Волшебник');
    wizard.innerHTML = `
      <path d="M11 36 L15 20 L25 20 L30 36 Z" fill="#287dff" stroke="#102e70"/>
      <circle cx="20" cy="17" r="6" fill="#ffd6a0"/>
      <path d="M9 13 L20 2 L30 13 Z" fill="#ffdc36" stroke="#a77c00"/>
      <path d="M8 13 H32" stroke="#ffdc36" stroke-width="3"/>
      <circle cx="18" cy="17" r="1" fill="#20202b"/>
      <circle cx="23" cy="17" r="1" fill="#20202b"/>
      <path d="M17 22 L21 29 L25 22" fill="#f5f0df"/>
      <path d="M32 35 L34 20" stroke="#ce9b56" stroke-width="2"/>
      <circle cx="34" cy="19" r="2.5" fill="#86e8ff"/>`;

    character.svg = wizard;
    phoenix.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    phoenix.svg.setAttribute('viewBox', '0 0 40 40');
    phoenix.svg.setAttribute('class', 'phoenix');
    phoenix.svg.setAttribute('role', 'img');
    phoenix.svg.setAttribute('aria-label', phoenix.name);
    phoenix.svg.innerHTML = `
      <path d="M18 23 L10 37 L20 31 L24 39 L27 25" fill="#ff6326"/>
      <path d="M19 22 Q5 25 2 6 L12 13 L9 3 L22 18
               Q32 9 37 4 L35 18 L29 25 Z" fill="#ef482d" stroke="#ffb52e"/>
      <path d="M20 14 Q15 19 18 28 L24 29 Q29 19 24 14 Z" fill="#ffbd35"/>
      <circle cx="23" cy="12" r="5" fill="#ff8a2b"/>
      <path d="M27 11 L33 14 L27 15 M20 8 L18 2 L25 7" fill="#ffe176"/>
      <circle cx="25" cy="11" r="1" fill="#251d23"/>`;

    // У каждого феникса свой SVG-элемент, хотя рисунок одинаковый.
    secondPhoenix.svg = phoenix.svg.cloneNode(true);
    secondPhoenix.svg.setAttribute('aria-label', secondPhoenix.name);

    monk.svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    monk.svg.setAttribute('viewBox', '0 0 40 40');
    monk.svg.setAttribute('class', 'monk');
    monk.svg.setAttribute('role', 'img');
    monk.svg.setAttribute('aria-label', monk.name);
    monk.svg.innerHTML = `
      <path d="M10 37 L14 21 L26 21 L31 37 Z" fill="#b86028" stroke="#713c22"/>
      <path d="M15 22 L25 35 M25 22 L15 35" stroke="#e7a34a" stroke-width="3"/>
      <circle cx="20" cy="13" r="7" fill="#f1be8d"/>
      <circle cx="18" cy="13" r="1" fill="#30241e"/>
      <circle cx="23" cy="13" r="1" fill="#30241e"/>
      <path d="M12 27 L20 29 L28 27" fill="none" stroke="#f1be8d" stroke-width="3"/>
      <path d="M33 36 V10" stroke="#bc9159" stroke-width="2"/>`;

    for (const id of turnOrderIds) {
      const entity = entities.find(item => item.id === id);
      if (!entity) continue;
      const slot = document.createElement('div');
      slot.className = 'turn-slot';
      slot.setAttribute('aria-label', entity.name);
      slot.appendChild(entity.svg.cloneNode(true));
      slot.addEventListener('mouseenter', () => {
        queueHoveredEntityId = entity.id;
        updatePanel();
      });
      slot.addEventListener('mouseleave', () => {
        queueHoveredEntityId = null;
        updatePanel();
      });
      turnSlots.set(entity.id, slot);
      turnOrder.appendChild(slot);
    }
    turnOrder.addEventListener('mouseleave', () => {
      queueHoveredEntityId = null;
      updatePanel();
    });

    for (let y = 0; y < SIZE; y++) {
      for (let x = 0; x < SIZE; x++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.x = x;
        cell.dataset.y = y;
        cell.dataset.terrain = terrain.get(`${x},${y}`);
        cell.appendChild(createTerrain(cell.dataset.terrain));
        if (cell.dataset.terrain === 'deep-water') cell.classList.add('blocked');
        const type = obstacles.get(`${x},${y}`);
        if (type) {
          cell.classList.add('blocked');
          cell.appendChild(createObstacle(type));
        }
        battlefield.appendChild(cell);
        cells.push(cell);
      }
    }

    function renderPosition() {
      // Перенос DOM-элемента мгновенный: никаких CSS-переходов.
      for (const entity of entities) {
        cells[entity.position.y * SIZE + entity.position.x].appendChild(entity.svg);
      }
    }

    function buildPath(start, target) {
      if (!isFree(start) || !isFree(target)) return null;
      const heuristic = (point) => Math.abs(point.x - target.x) + Math.abs(point.y - target.y);
      const open = [{ ...start, g: 0, h: heuristic(start), parent: null, axis: null, turn: 0 }];
      const bestCost = new Map([[keyOf(start), 0]]);
      const directions = [[1, 0], [0, 1], [-1, 0], [0, -1]];

      // A*: g учитывает вход на поверхность, h — Манхэттен (минимальная цена шага 1).
      // Чередование осей влияет только на выбор среди равных оценок,
      // поэтому не мешает находить кратчайшие обходные маршруты.
      while (open.length > 0) {
        open.sort((a, b) => (a.g + a.h) - (b.g + b.h) || a.h - b.h || a.turn - b.turn);
        const current = open.shift();
        if (current.g !== bestCost.get(keyOf(current))) continue;
        if (current.x === target.x && current.y === target.y) {
          const path = [];
          for (let node = current; node.parent; node = node.parent) {
            path.push({ x: node.x, y: node.y });
          }
          return path.reverse();
        }
        for (const [dx, dy] of directions) {
          const next = { x: current.x + dx, y: current.y + dy };
          if (!isFree(next)) continue;
          const g = current.g + entryCost(next);
          if (g >= (bestCost.get(keyOf(next)) ?? Infinity)) continue;
          bestCost.set(keyOf(next), g);
          const axis = dx ? 'x' : 'y';
          open.push({ ...next, g, h: heuristic(next), parent: current, axis,
            turn: axis === current.axis ? 1 : 0 });
        }
      }
      return null; // Свободная цель может быть отрезана препятствиями.
    }

    function updatePanel() {
      hoveredEntityId = queueHoveredEntityId ?? fieldHoveredEntityId;
      const displayed = entities.find(entity => entity.id === (hoveredEntityId ?? activeEntityId));
      document.getElementById('character-name').textContent = displayed?.name ?? '—';
      document.getElementById('hp').textContent = displayed ? `HP: ${displayed.hp} / ${displayed.maxHP}` : '—';
      document.getElementById('ap').textContent = displayed ? `AP: ${displayed.ap} / ${displayed.maxAP}` : '—';
      document.getElementById('mp').textContent = displayed ? `MP: ${displayed.mp} / ${displayed.maxMP}` : '—';
      endTurnButton.disabled = !displayed || isMoving || ![character.id, monk.id].includes(activeEntityId);
      // Характеристики учитывают наведение, заклинания — только активного участника.
      for (const spell of activeEntity()?.spells ?? []) {
        const slot = spellSlots.get(spell);
        slot.disabled = !displayed || !canPrepareSpell(spell);
        slot.classList.toggle('prepared', activeEntity()?.spells.includes(spell) && preparedSpellId === spell.id);
        slot.setAttribute('aria-pressed', activeEntity()?.spells.includes(spell) && preparedSpellId === spell.id ? 'true' : 'false');
        slot.title = `${spell.name} · ${spell.isHeal ? `лечит ${spell.healAmount} HP` : `урон ${spell.damage}`} · ${spell.isAOE ? `зона ${spell.aoeSize}×${spell.aoeSize}` : 'одна цель'} · дальность ${spell.minRange ?? 1}–${spell.range} · ${spell.apCost} AP · кулдаун ${spell.maxCooldown}, текущий ${spell.cooldown} · ${spell.usesThisTurn} / ${spell.maxUsesPerTurn} использований`;
      }
      for (const cell of cells) cell.classList.remove('entity-hover');
      for (const entity of entities) {
        const active = entity.id === activeEntityId;
        turnSlots.get(entity.id).classList.toggle('active', active);
        turnSlots.get(entity.id).setAttribute('aria-current', active ? 'true' : 'false');
        if (queueHoveredEntityId === entity.id) {
          cells[entity.position.y * SIZE + entity.position.x].classList.add('entity-hover');
        }
      }
    }

    // Будущие действия используют эту проверку, чтобы не уйти в минус.
    function spendAP(amount) {
      if (isMoving || activeEntityId !== character.id || !Number.isInteger(amount) || amount < 0 || amount > character.ap) return false;
      character.ap -= amount;
      updatePanel();
      return true;
    }

    function beginTurn(entity) {
      // Если участник удалён, выбираем следующего живого по фиксированной очереди.
      if (entities.indexOf(entity) === -1) {
        entity = nextLivingEntity(activeEntityId);
      }
      const version = ++turnVersion;
      preparedSpellId = null;
      if (!entity) {
        activeEntityId = null;
        renderSpellPanel();
        clearHighlight();
        updatePanel();
        return;
      }
      // Начало личного хода обновляет только заклинания этого участника.
      for (const spell of entity.spells) {
        spell.usesThisTurn = 0;
        spell.cooldown = Math.max(0, spell.cooldown - 1);
      }
      activeEntityId = entity.id;
      renderSpellPanel();
      entity.ap = entity.maxAP;
      entity.mp = entity.maxMP;
      clearHighlight();
      updatePanel(); // HP не является ресурсом хода.
      if (entity.type === 'phoenix') {
        // Каждый враг отдельно показывается в очереди в течение 100 мс.
        setTimeout(() => {
          // Смерть или новая передача уже завершили этот ход: старый таймер не действует.
          if (version !== turnVersion) return;
          const index = entities.indexOf(entity);
          if (index === -1) {
            beginTurn(nextLivingEntity(activeEntityId));
            return;
          }
          entity.ap = entity.maxAP;
          entity.mp = entity.maxMP;
          beginTurn(nextLivingEntity(entity.id));
        }, 100);
      }
    }

    endTurnButton.addEventListener('click', () => {
      if (isMoving || ![character.id, monk.id].includes(activeEntityId)) return;
      beginTurn(nextLivingEntity(activeEntityId));
    });

    // Двигаться могут союзники; фениксы пока только пропускают ход.
    function activeMover() {
      return entities.find(entity => entity.id === activeEntityId && entity.hp > 0
        && (entity.type === 'wizard' || entity.type === 'monk'));
    }

    function takeStep() {
      const mover = activeMover();
      if (!isMoving || !mover || stepQueue.length === 0) return;
      const next = stepQueue[0];
      if (entryCost(next) > mover.mp) {
        stepQueue = [];
        isMoving = false;
        battlefield.classList.remove('moving');
        updatePanel();
        return;
      }
      mover.position = stepQueue.shift();
      mover.mp -= entryCost(mover.position);
      renderPosition();
      if (stepQueue.length > 0) {
        setTimeout(takeStep, STEP_MS);
      } else {
        isMoving = false;
        battlefield.classList.remove('moving');
      }
      updatePanel();
    }

    battlefield.addEventListener('mousemove', (event) => {
      const cell = event.target.closest('.cell');
      if (!cell || !battlefield.contains(cell)) {
        fieldHoveredEntityId = null;
        updatePanel();
        if (preparedSpellId) highlightSpellRange();
        else clearHighlight(); // В том числе при наведении на промежуток сетки.
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      fieldHoveredEntityId = entities.find(entity => keyOf(entity.position) === keyOf(target))?.id ?? null;
      updatePanel();
      const mover = activeMover();
      if (isMoving || !mover) return;
      if (preparedSpellId) {
        const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
        if (spell) {
          const key = `spell:${keyOf(target)}`;
          if (previewKey !== key) {
            highlightSpellRange(canTarget(target, spell) ? target : null);
            previewKey = key;
          }
        }
        return;
      }
      // Повторные события в одной клетке не запускают A* заново.
      // Позиция и MP включены в ключ, чтобы не использовать устаревшее превью.
      const key = `${mover.id}:${keyOf(target)}:${keyOf(mover.position)}:${mover.mp}`;
      if (previewKey === key) return;
      clearHighlight();
      // Стоимость нужна только для свободного места назначения.
      // Даже свой персонаж занимает клетку: число под ним не показываем.
      if (!isFree(target) || entities.some(entity => keyOf(entity.position) === keyOf(target))) {
        previewKey = key;
        return;
      }
      const path = buildPath(mover.position, target);
      if (path) highlightPath(path, mover.mp);
      costLabel.textContent = path === null ? '∞' : String(pathCost(path));
      cell.appendChild(costLabel);
      previewKey = key;
    });

    battlefield.addEventListener('mouseleave', () => {
      if (preparedSpellId) highlightSpellRange();
      else clearHighlight();
      fieldHoveredEntityId = null;
      updatePanel();
    });

    battlefield.addEventListener('click', (event) => {
      // Новая цель не прерывает уже начатый маршрут.
      const mover = activeMover();
      if (isMoving || !mover) return;
      const cell = event.target.closest('.cell');
      if (!cell || !battlefield.contains(cell)) return;
      if (preparedSpellId) {
        castSpell(cell);
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      if (!isFree(target)) return;
      const path = buildPath(mover.position, target);
      // Недоступный маршрут игнорируем, сохраняя текущее превью.
      if (mover.mp === 0 || path === null || pathCost(path) > mover.mp) return;
      if (path.length === 0) return;
      clearHighlight();
      fieldHoveredEntityId = null;
      stepQueue = path;
      isMoving = true;
      battlefield.classList.add('moving');
      updatePanel();
      setTimeout(takeStep, STEP_MS);
    });

    renderPosition();
    renderSpellPanel();
    updatePanel();
  </script>
</body>
</html>
