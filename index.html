<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поле волшебника</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #1a1a1a;
      display: grid;
      place-items: center;
      color: #f1f3f7;
      font-family: system-ui, sans-serif;
    }
    .game {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .arena { display: flex; flex-direction: column; align-items: center; min-width: 0; gap: 12px; }
    #turn-order { width: 100%; display: flex; gap: 8px; padding: 6px; background: #262b33; border-radius: 6px; }
    .turn-slot { width: 44px; min-width: 0; height: auto; aspect-ratio: 1; padding: 3px; border: 2px solid transparent; border-radius: 5px; background: #343b46; }
    .turn-slot.active { background: #606c80; border-color: #ffdc36; }
    .cell.entity-hover { outline: 2px solid #ffdc36; outline-offset: -2px; }
    .panel {
      width: 220px;
      flex-shrink: 0;
      max-height: 96vh;
      max-height: 96dvh;
      overflow-y: auto;
      padding: 12px;
      background: #262b33;
      border: 1px solid #515966;
      border-radius: 10px;
    }
    .spells { width: 176px; max-width: 100%; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 14px; }
    .spell-pages { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
    .spell-pages button {
      width: 36px; height: 26px; border: 1px solid #65738a; border-radius: 5px;
      background: #343e50; color: #edf3ff; font-size: 18px; cursor: pointer;
    }
    .spell-pages button:hover:not(:disabled) { background: #53647d; border-color: #b9cce7; }
    .spell-pages button:disabled { color: #737c89; background: #272d36; border-color: #414955; cursor: default; }
    .spell-slot { aspect-ratio: 1; min-width: 0; padding: 3px; background: #191e26; border: 2px solid #515966; border-radius: 4px; }
    button.spell-slot { cursor: pointer; }
    .spell-slot svg { display: block; width: 100%; height: 100%; pointer-events: none; }
    .spell-slot.prepared { border-color: #ffdc36; }
    .spell-slot:disabled { opacity: .4; cursor: default; }
    .effects-panel { position: relative; margin-top: 14px; padding-top: 8px; border-top: 1px solid #515966; }
    .effects-panel h2 { font-size: 12px; color: #a9b1bf; margin: 10px 28px 8px 0; }
    .effects-panel section + section { margin-top: 14px; padding-top: 4px; border-top: 1px solid #404754; }
    .effect-grid { width: 176px; max-width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .effect-icon { color: #a9b1bf; font: inherit; cursor: help; }
    .close-effects { position: absolute; right: 0; top: 4px; border: 0; border-radius: 4px; background: #343b46; color: #e6eaf0; font-size: 22px; line-height: 24px; width: 24px; cursor: pointer; }
    .close-effects:hover { background: #596474; }
    .spell-tooltip {
      position: fixed; z-index: 210; box-sizing: border-box;
      width: min(300px, calc(100vw - 16px)); max-height: calc(100dvh - 16px);
      overflow-y: auto; padding: 14px; border: 1px solid #63748b; border-radius: 10px;
      background: rgba(19, 25, 35, .97); color: #e6edf5; box-shadow: 0 8px 28px #0009;
      font: 13px/1.45 system-ui, sans-serif; pointer-events: none; overflow-wrap: anywhere;
    }
    .spell-tooltip p { margin: 4px 0 0; }
    .spell-tooltip .spell-title { display: block; margin-bottom: 8px; font-size: 15px; color: #fff; }
    .spell-tooltip .spell-description { margin-bottom: 10px; color: #bfcbdc; }
    .spell-tooltip strong { font-weight: 700; }
    .effect-tooltip { position: absolute; z-index: 200; width: min(240px, calc(100vw - 16px)); padding: 12px; background: rgba(21, 25, 32, .97); border: 1px solid #606a7a; border-radius: 7px; color: #f1f3f7; box-shadow: 0 5px 18px #0008; font: 13px/1.4 system-ui, sans-serif; pointer-events: none; }
    .effect-tooltip p { margin: 0; overflow-wrap: anywhere; }
    .effect-tooltip .effect-title { display: block; margin-bottom: 8px; overflow-wrap: anywhere; }
    .effect-tooltip p + p { margin-top: 6px; }
    .panel h1 { font-size: 18px; margin: 0 0 10px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 8px; margin-bottom: 12px; font-variant-numeric: tabular-nums; font-size: 11.5px; line-height: 1.2; }
    .stat-column { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .stat-column:nth-child(even) { border-left: 1px solid #46505d; padding-left: 6px; }
    .stat-column:nth-child(n+3) { border-top: 1px solid #46505d; padding-top: 6px; }
    .resistance-stat { display: flex; align-items: center; gap: 6px; }
    .resistance-stat svg { width: 12px; height: 12px; flex: 0 0 12px; }
    .stat-column h2 { margin: 0 0 3px; color: #a9b1bf; font-size: 10px; font-weight: 500; }
    .stat-column span { white-space: nowrap; }
    #end-turn {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 6px;
      background: #ffdc36;
      color: #20202b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #end-turn:hover:not(:disabled) { background: #ffea85; }
    #end-turn:focus-visible { outline: 3px solid #86e8ff; outline-offset: 3px; }
    #end-turn:disabled { opacity: 0.45; cursor: wait; }
    #battlefield {
      position: relative;
      /* Запас по краям; dvh учитывает панели мобильного браузера. */
      width: min(calc(100vw - 268px), calc(96vh - 68px));
      width: min(calc(100vw - 268px), calc(96dvh - 68px));
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(16, minmax(0, 1fr));
      grid-template-rows: repeat(16, minmax(0, 1fr));
      gap: 1px;
      padding: 1px;
      background: #b8b8b8;
    }
    @media (min-width: 641px) {
      .arena {
        width: min(calc(100vw - 268px), calc(96vh - 68px));
        width: min(calc(100vw - 268px), calc(96dvh - 68px));
      }
    }
    @media (max-width: 640px) {
      .game { flex-direction: column; gap: 12px; }
      #battlefield {
        width: min(96vw, max(32px, calc(96vh - var(--panel-height, 550px) - 92px)));
        width: min(96vw, max(32px, calc(96dvh - var(--panel-height, 550px) - 92px)));
      }
      .panel { width: 96vw; padding: 12px; max-height: calc(96vh - 160px); max-height: calc(96dvh - 160px); }
      .spells { width: 148px; margin: 10px auto 0; }
      .panel h1 { margin-bottom: 8px; font-size: 18px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin-bottom: 10px; line-height: 1.1; }
      .stat-column { gap: 1px; }
      .stat-column:nth-child(3) { border-left: 0; padding-left: 0; }
      .stat-column:nth-child(n+3) { border-top: 1px solid #46505d; padding-top: 8px; }
    }
    .cell {
      position: relative;
      isolation: isolate;
      min-width: 0;
      min-height: 0;
      background: #30343b;
      cursor: pointer;
    }
    .cell:hover { background: #424954; }
    /* Цвет лежит в фоне клетки, под SVG и внутри линий сетки. */
    .terrain { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .terrain svg { display: block; width: 100%; height: 100%; }
    /* Поверх поверхности, но под существами: прозрачная заливка не скрывает SVG. */
    .cell::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    #battlefield .obstacle, #battlefield .wizard, #battlefield .wolf, #battlefield .monk {
      position: absolute; inset: 0; z-index: 3;
    }
    .path-cost {
      position: absolute; top: 1px; right: 1px; z-index: 2;
      color: #edb4ff; background: rgba(26, 12, 40, .85); border-radius: 3px;
      padding: 0 3px; font-size: clamp(9px, 1.4vmin, 14px); line-height: 1.3;
      font-weight: 700; pointer-events: none;
    }
    .effect-preview {
      position: absolute; top: 1px; right: 1px; z-index: 4;
      padding: 0 3px; border-radius: 3px; background: rgba(20, 20, 25, .85);
      font-size: clamp(9px, 1.4vmin, 14px); line-height: 1.3;
      font-weight: 700; pointer-events: none;
    }
    .effect-preview.damage { color: #ff8585; }
    .effect-preview.heal { color: #83efac; }
    .effect-preview.shield { color: #ffc36b; }
    .elemental-shield-flash svg { display: block; width: 100%; height: 100%; }
    .elemental-shield-flash {
      position: absolute; inset: 2px; z-index: 6; pointer-events: none;
      animation: elemental-shield-glow .5s ease-out both;
    }
    @keyframes elemental-shield-glow {
      from { transform: scale(.65); opacity: .9; }
      to { transform: scale(1.1); opacity: 0; }
    }
    .state-animation { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .state-animation svg { width: 100%; height: 100%; display: block; }
    .burning-hands-flame {
      position: absolute; inset: 0; z-index: 6; pointer-events: none;
      background: radial-gradient(ellipse at bottom, #fff2a3, #ff8b28 35%, #ee432588 65%, transparent 80%);
      animation: burning-hands-wave .35s ease-out both;
    }
    @keyframes burning-hands-wave {
      from { transform: scale(.3); opacity: .9; }
      to { transform: scale(1.15); opacity: 0; }
    }
    .state-animation.weakness-vigor { animation: choice-pulse .5s ease-out both; }
    .state-animation.weakness-vigor.ally { background: radial-gradient(circle, #4add8eaa, transparent 75%); }
    .state-animation.weakness-vigor.enemy { background: radial-gradient(circle, #ed6068aa, transparent 75%); }
    @keyframes choice-pulse {
      from { transform: scale(.6); opacity: 1; }
      to { transform: scale(1.15); opacity: 0; }
    }
    .state-animation.adrenaline { background: radial-gradient(circle, #ff5366aa, #b8162833 55%, transparent 75%); animation: adrenaline-pulse .5s ease-out both; }
    @keyframes adrenaline-pulse {
      0% { transform: scale(.5); opacity: .2; }
      50% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.2); opacity: 0; }
    }
    .state-animation.sky-shot svg { animation: sky-shot-rise .5s ease-out both; }
    @keyframes sky-shot-rise {
      from { transform: translateY(15px); opacity: 1; }
      to { transform: translateY(-35px); opacity: 0; }
    }
    .state-animation.heavy svg { animation: heavy-fall .5s ease-out both; }
    .heavy-impact {
      position: absolute; inset: 55% 8% 5%; border: 2px solid #b2bdcd;
      border-radius: 50%; animation: heavy-impact .5s ease-out both;
    }
    @keyframes heavy-fall {
      0% { transform: translateY(-80%); opacity: 0; }
      60% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(0); opacity: 0; }
    }
    @keyframes heavy-impact {
      0%, 55% { transform: scale(.2); opacity: 0; }
      65% { transform: scale(.5); opacity: .9; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .state-animation.wind-rose { inset: -100%; animation: wind-rose-burst .5s ease-out both; }
    @keyframes wind-rose-burst {
      from { transform: scale(.3); opacity: 1; }
      to { transform: scale(1); opacity: 0; }
    }
    .state-animation.wind { overflow: hidden; }
    .state-animation.wind svg { animation: wind-gust .5s ease-out both; }
    .state-animation.mud svg { animation: mud-splash .5s ease-out both; }
    @keyframes wind-gust {
      from { transform: translateX(-40%); opacity: .8; }
      to { transform: translateX(40%); opacity: 0; }
    }
    @keyframes mud-splash {
      from { transform: scale(.3); opacity: .85; }
      to { transform: scale(1.2); opacity: 0; }
    }
    .effect-preview.membrane { white-space: pre-line; font-size: 10px; }
    .membrane-animation { position: absolute; inset: 0; z-index: 6; pointer-events: none; animation: membrane-inflate .5s ease-out both; }
    .membrane-animation svg { display: block; width: 100%; height: 100%; }
    @keyframes membrane-inflate {
      from { transform: scale(.4); opacity: .9; }
      to { transform: scale(1.15); opacity: 0; }
    }
    .light-flash { position: absolute; inset: 0; z-index: 6; pointer-events: none; animation: light-burst .4s ease-out both; }
    .light-flash svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 6px #fff4ae); }
    @keyframes light-burst {
      from { transform: scale(.35); opacity: 1; }
      to { transform: scale(1.3); opacity: 0; }
    }
    .freeze-animation { position: absolute; inset: 0; z-index: 6; pointer-events: none; animation: freeze-crystals .5s ease-out both; }
    .freeze-animation svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 4px #89eaff); }
    @keyframes freeze-crystals {
      from { transform: scale(.4); opacity: 1; }
      to { transform: scale(1.2); opacity: 0; }
    }
    .effect-preview.freeze { color: #a4eaff; }
    .miss-label {
      position: absolute; left: 50%; top: 35%; z-index: 8;
      color: #fff2a0; font: 800 clamp(10px, 1.5vmin, 15px)/1 system-ui, sans-serif;
      white-space: nowrap; text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 0 0 5px #000;
      pointer-events: none; animation: miss-float .5s ease-out both;
    }
    @keyframes miss-float {
      from { transform: translate(-50%, 0); opacity: 1; }
      to { transform: translate(-50%, -25px); opacity: 0; }
    }
    .heal-spark {
      position: absolute; top: 65%; z-index: 5;
      color: #74ef9e; font-size: 14px; line-height: 1; font-weight: 700;
      text-shadow: 0 1px 2px #153822, 0 0 3px #153822;
      pointer-events: none;
      animation: heal-float .5s ease-out both;
    }
    @keyframes heal-float {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-25px); opacity: 0; }
    }
    .spell-projectile {
      position: absolute; z-index: 100; pointer-events: none;
      filter: drop-shadow(0 0 4px #ff7b24);
    }
    .spell-projectile[data-type="ice"] { filter: drop-shadow(0 0 4px #80dcff); }
    .spell-projectile[data-type^="spark"] { filter: drop-shadow(0 0 5px #b9edff); }
    .spell-projectile svg { display: block; width: 100%; height: 100%; }
    .cube-explosion {
      position: absolute; inset: 0; z-index: 6; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 221, 100, .9), rgba(255, 95, 30, .65) 55%, transparent 75%);
      pointer-events: none;
      animation: cube-burst .4s ease-out both;
    }
    @keyframes cube-burst {
      from { transform: scale(.5); opacity: .8; }
      to { transform: scale(1.2); opacity: 0; }
    }
    .armageddon-rain {
      position: absolute; inset: 0; z-index: 20; overflow: hidden;
      pointer-events: none;
    }
    .armageddon-drop {
      position: absolute; width: 4px; height: 32px; border-radius: 50%;
      background: linear-gradient(transparent, #ff5d25, #ffc45a);
      box-shadow: 0 0 5px rgba(255, 105, 35, .6); pointer-events: none;
      animation: armageddon-fall .7s ease-out both;
    }
    .armageddon-rain.water .armageddon-drop {
      background: linear-gradient(transparent, #2a7fff, #a0d4ff);
      box-shadow: 0 0 5px #2a7fff;
    }
    .rain-cell {
      position: absolute; inset: 0; z-index: 20; overflow: hidden;
      pointer-events: none;
    }
    .rain-drop {
      position: absolute; width: 3px; height: 35%; border-radius: 50%;
      background: linear-gradient(transparent, #2a7fff, #a0d4ff);
      animation: rain-fall .65s linear both;
    }
    @keyframes rain-fall {
      from { transform: translateY(0); opacity: .9; }
      to { transform: translateY(var(--rain-distance)); opacity: 0; }
    }
    @keyframes armageddon-fall {
      from { transform: translate(-20px, -25px) rotate(-35deg); opacity: .8; }
      to { transform: translate(35px, 55px) rotate(-35deg); opacity: 0; }
    }
    .cell.spell-aoe::after { box-shadow: inset 0 0 0 2px rgba(100, 200, 255, 0.8); }
    .cell.spell-range::after, .cell.path-reachable::after {
      background-image: linear-gradient(rgba(80, 220, 120, 0.35), rgba(80, 220, 120, 0.35));
    }
    .cell.path-over-budget::after {
      background-image: linear-gradient(rgba(220, 80, 80, 0.35), rgba(220, 80, 80, 0.35));
    }
    #battlefield.moving .cell { cursor: wait; }
    .cell.blocked { cursor: not-allowed; }
    .obstacle, .wizard, .wolf, .monk { display: block; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body>
  <main class="game">
    <section class="arena" aria-label="Поле и очередь ходов">
      <div id="battlefield" aria-label="Поле боя 16 на 16 клеток"></div>
      <div id="turn-order" aria-label="Очередь ходов"></div>
    </section>
    <aside class="panel" aria-labelledby="character-name">
      <h1 id="character-name">Волшебник</h1>
      <div class="stats" aria-live="polite" aria-atomic="true">
        <section class="stat-column"><h2>Основные</h2>
          <span id="ap"></span>
          <span id="mp"></span>
          <span id="hp"></span>
          <span id="ra"></span>
          <span id="wp"></span>
          <span id="vs"></span>
          <span id="es"></span>
        </section>
        <section class="stat-column"><h2>Атрибуты</h2>
          <span id="vit"></span>
          <span id="str"></span>
          <span id="att"></span>
          <span id="int"></span>
          <span id="wis"></span>
          <span id="cha"></span>
          <span id="luc"></span>
        </section>
        <section class="stat-column"><h2>Сопротивления</h2>
          <span class="resistance-stat" title="Броня" aria-label="Броня"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1 L6 2 Q8 5 10 2 L13 1 L15 5 L12 7 L13 14 Q8 16 3 14 L4 7 L1 5 Z" fill="#aebaca" stroke="#596879" stroke-width=".7"/><path d="M4 3 L5 7 M12 3 L11 7 M8 5 V14 M4 10 L8 11 L12 10" fill="none" stroke="#e1e7ed" stroke-width=".8"/></svg><span id="ac"></span></span>
          <span class="resistance-stat" title="Физика" aria-label="Физика"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2 L8 1 L13 2 V8 Q12 12 8 15 Q4 12 3 8 Z" fill="#b4c1d3"/><path d="M8 3 V12" stroke="#65728a"/></svg><span id="res-physical"></span></span>
          <span class="resistance-stat" title="Огонь" aria-label="Огонь"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q9 6 13 7 Q17 14 8 15 Q0 15 2 8 L5 3 L5 9 Q9 7 8 1" fill="#ff853e"/></svg><span id="res-fire"></span></span>
          <span class="resistance-stat" title="Вода" aria-label="Вода"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q3 7 3 10 A5 5 0 0 0 13 10 Q13 7 8 1" fill="#6fbaff"/><path d="M5 10 Q5 12 7 12" fill="none" stroke="#d0efff"/></svg><span id="res-water"></span></span>
          <span class="resistance-stat" title="Воздух" aria-label="Воздух"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5 H10 Q15 5 13 2 Q11 0 9 3 M1 9 H12 Q16 9 14 13 Q12 16 10 13 M2 13 H6" stroke="#b7eeeb" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg><span id="res-air"></span></span>
          <span class="resistance-stat" title="Земля" aria-label="Земля"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 14 L6 3 L9 8 L12 5 L15 14 Z" fill="#c59b67"/><path d="M6 3 L4 8 H8 Z" fill="#eee0c4"/></svg><span id="res-earth"></span></span>
          <span class="resistance-stat" title="Разум" aria-label="Разум"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8 Q8 -1 15 8 Q8 17 1 8 Z" fill="#ba9bec"/><circle cx="8" cy="8" r="3" fill="#423163"/><circle cx="9" cy="7" r="1" fill="#ece5ff"/></svg><span id="res-mind"></span></span>
          <span class="resistance-stat" title="Яд" aria-label="Яд"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 Q3 7 3 10 A5 5 0 0 0 13 10 Q13 7 8 1" fill="#91cf69"/><circle cx="6" cy="10" r="1" fill="#29452c"/><circle cx="10" cy="10" r="1" fill="#29452c"/><path d="M6 13 H10" stroke="#29452c"/></svg><span id="res-poison"></span></span>
        </section>
        <section class="stat-column"><h2>Бой</h2>
          <span id="acc"></span>
          <span id="eva"></span>
          <span id="blo"></span>
          <span id="ini"></span>
        </section>
      </div>
      <button id="end-turn" type="button">Передать ход</button>
      <div id="spells" class="spells" aria-label="Заклинания"></div>
      <div id="spell-pages" class="spell-pages" aria-label="Переключение страниц заклинаний" hidden>
        <button id="spell-page-prev" type="button" aria-label="Предыдущая страница заклинаний">←</button>
        <button id="spell-page-next" type="button" aria-label="Следующая страница заклинаний">→</button>
      </div>
      <div id="effects-panel" class="effects-panel" aria-label="Эффекты выбранного существа" hidden>
        <button id="close-effects" class="close-effects" type="button" aria-label="Закрыть эффекты">×</button>
        <section><h2>Заклинания</h2><div id="spell-effects" class="effect-grid"></div></section>
        <section><h2>Состояния</h2><div id="state-effects" class="effect-grid"></div></section>
      </div>
    </aside>
  </main>
  <script src="data/states.js"></script>
  <script src="data/spellData.js"></script>
  <script type="module">
    import { getConeCells, getBlockedConeCells, findSparkTargets, affectedCells } from './spellLogic.js';

    const SIZE = 16;
    const STEP_MS = 90;
    const battlefield = document.getElementById('battlefield');
    const cells = [];
    // Полная карта поверхностей независима от ящиков.
    const terrain = new Map();
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
      terrain.set(`${x},${y}`, x >= 9 && x <= 12 && y >= 5 && y <= 11 ? 'sand' : 'grass');

      const areaLabel = spell.isGlobal ? 'вся карта' : spell.isCone ? `конус D${spell.aoeSize}` : spell.aoeSize === 1 ? '1 клетка' : `квадрат D${spell.aoeSize}`;
      // Тип выстрела дополняет форму АОЕ, не меняя её и остальные строки тултипа.
      addLine('АОЕ', `${areaLabel}${spell.isShot ? ' [тип: Выстрел]' : ''}`);
      addLine('Цель', { any: 'любая', ally: 'союзник', enemy: 'враг' }[spell.target] ?? 'нет');
      addLine('LOS', spell.noLOS ? 'не требует' : 'требует');
      const elements = { fire: 'огонь', water: 'вода', earth: 'земля', air: 'воздух', light: 'свет' };
      if (spell.damage > 0) addLine('Урон', `${spell.damage} ${elements[spell.damageType] ?? spell.damageType}`);
      if (spell.isHeal) addLine('Лечение', spell.healAmount);
      const effects = [];
      if (spell.stateId) effects.push(stateTypes.get(spell.stateId)?.name ?? spell.stateId);
      if (spell.burnDuration) effects.push(stateTypes.get('burning').name);
      if (spell.isElementalShield) effects.push(spell.damageType === 'physical' ? `Блокирует ${spell.shieldAmount} ед. физического урона` : `Блокирует ${spell.shieldAmount} ед. урона ${{ fire: 'огнём', water: 'водой', earth: 'землёй', air: 'воздухом' }[spell.damageType]}`);
      if (spell.isSkyShot || spell.isWeaknessVigor) effects.push(spell.effectDescription);
      if (spell.isMembrane) effects.push(`+${spell.esAmount} ES, +${spell.evaAmount}% уклонения`);
      if (effects.length) {
        effects.forEach((effect, index) => {
          if (index === 0) addLine('Эффекты', effect);
          else { const line = document.createElement('p'); line.textContent = effect; tooltip.appendChild(line); }
        });
        addLine('Длительность', spell.isSkyShot ? '1 ход или до первого применения' : spellTurnLabel(spell.stateDuration ?? spell.shieldDuration ?? spell.effectDuration ?? spell.burnDuration));
      }
      document.body.appendChild(tooltip);
      // Предпочитаем свободную сторону; на узком экране — место сверху или снизу.
      const r = icon.getBoundingClientRect();
      let t = tooltip.getBoundingClientRect(), left, top;
      if (r.left >= t.width + 16) { left = r.left - t.width - 8; top = r.top; }
      else if (innerWidth - r.right >= t.width + 16) { left = r.right + 8; top = r.top; }
      else {
        const below = innerHeight - r.bottom - 16, above = r.top - 16;
        const useBelow = below >= above;
        tooltip.style.maxHeight = `${Math.max(0, useBelow ? below : above)}px`;
        t = tooltip.getBoundingClientRect();
        left = r.left;
        top = useBelow ? r.bottom + 8 : r.top - t.height - 8;
      }
      tooltip.style.left = `${Math.max(8, Math.min(left, innerWidth - t.width - 8))}px`;
      tooltip.style.top = `${Math.max(8, Math.min(top, innerHeight - t.height - 8))}px`;
      icon.setAttribute('aria-describedby', tooltip.id);
      spellTooltip = tooltip;
      spellTooltipIcon = icon;
    }
    window.addEventListener('resize', hideSpellTooltip);
    window.addEventListener('scroll', hideSpellTooltip, true);

    // Ключ — объект, поэтому одноимённые кубы разных владельцев не пересекаются.
    function renderSpellPanel(resetPage = true) {
      if (resetPage) currentSpellPage = 0;
      hideSpellTooltip();
      document.getElementById('spells').replaceChildren();
      spellSlots.clear();
      const pages = getSpellPages();
      if (currentSpellPage >= pages.length) currentSpellPage = 0;
      const currentSpells = pages[currentSpellPage] ?? [];
      for (const spell of currentSpells) {
        const slot = document.createElement('button');
        slot.type = 'button';
        slot.className = 'spell-slot';
        slot.innerHTML = spell.svg;
        slot.setAttribute('aria-label', spell.name);
        slot.addEventListener('mouseenter', () => showSpellTooltip(slot, spell));
        slot.addEventListener('mouseleave', hideSpellTooltip);
        slot.addEventListener('focus', () => showSpellTooltip(slot, spell));
        slot.addEventListener('blur', hideSpellTooltip);
        slot.addEventListener('click', () => {
          if (isCasting) return;
          if (!canPrepareSpell(spell)) return;
          hideSpellTooltip();
          preparedSpellId = spell.id;
          highlightSpellRange();
          updatePanel();
        });
        spellSlots.set(spell, slot);
        document.getElementById('spells').appendChild(slot);
      }
      for (let i = currentSpells.length; i < 16; i++) {
        const slot = document.createElement('div');
        slot.className = 'spell-slot';
        document.getElementById('spells').appendChild(slot);
      }

    }

    function isFrozen(entity) {
      return !!entity && entity.states.some(state => state.id === 'freeze' && !state.suppressed
        && (state.duration > 0 || state.permanent || state.innate));
    }

    function canPrepareSpell(spell) {
      const caster = activeEntity();
      return !!spell && !!caster && caster.hp > 0 && caster.spells.includes(spell) && !isMoving && !isCasting && !isSkippingTurn && !isFrozen(caster)
        && caster.ap >= spell.apCost && spell.usesThisTurn < spell.maxUsesPerTurn
        && (spell.maxUsesPerBattle === undefined || spell.usesTotal < spell.maxUsesPerBattle)
        && spell.cooldown === 0;
    }

    // Supercover от центра до центра с исключением для углов при 45°. Сравниваем моменты
    // пересечения границ целыми числами, без погрешностей float.
    function checkLOS(from, to) {
      const dx = Math.abs(to.x - from.x), dy = Math.abs(to.y - from.y);
      const sx = Math.sign(to.x - from.x), sy = Math.sign(to.y - from.y);
      let x = from.x, y = from.y;
      let crossedX = 0, crossedY = 0;

      function blocked(cx, cy) {
        if (obstacles.get(`${cx},${cy}`) === 'crate') return true;
        // Существо в исходной или целевой клетке не закрывает выстрел.
        if ((cx === from.x && cy === from.y) || (cx === to.x && cy === to.y)) return false;
        return entities.some(entity => entity.position.x === cx && entity.position.y === cy);
      }

      if (blocked(x, y)) return false;
      while (x !== to.x || y !== to.y) {
        const nextX = (2 * crossedX + 1) * dy;
        const nextY = (2 * crossedY + 1) * dx;
        if (nextX === nextY) {
          // Только при точных 45° разрешаем касание углов боковых клеток.
          // Диагональную клетку по-прежнему проверяем на препятствия.
          if (dx !== dy && (blocked(x + sx, y) || blocked(x, y + sy))) return false;
          x += sx;
          y += sy;
          crossedX++;
          crossedY++;
        } else if (nextX < nextY) {
          x += sx;
          crossedX++;
        } else {
          y += sy;
          crossedY++;
        }
        if (blocked(x, y)) return false;
      }
      return true;
    }

    function hasSkyShotBuff(entity) {
      return !!entity?.spellsOnMe.some(effect => effect.isSkyShot && effect.duration > 0 && !effect.suppressed);
    }

    function effectiveSpellRange(spell, caster = activeEntity()) {
      // RANGE и бонус следующего выстрела меняют только модифицируемую верхнюю границу.
      const skyBonus = spell.isShot && hasSkyShotBuff(caster) ? 2 : 0;
      return spell.modifiable
        ? Math.max(spell.minRange ?? 0, spell.range + (caster?.attributes.ra ?? 0) + skyBonus)
        : spell.range;
    }

    function inSpellReach(target, spell) {
      const caster = activeEntity();
      if (!caster || !spell || !caster.spells.includes(spell)) return false;
      const distance = Math.abs(target.x - caster.position.x) + Math.abs(target.y - caster.position.y);
      return target.x >= 0 && target.x < SIZE && target.y >= 0 && target.y < SIZE
        // Даже без LOS ящик в самой целевой клетке остаётся недопустимым.
        && (spell.isHeal || !obstacles.has(keyOf(target)))
        && distance >= (spell.isHeal ? 0 : (spell.minRange ?? 1)) && distance <= effectiveSpellRange(spell, caster)
        && (distance === 0 || spell.noLOS === true || (spell.isShot && hasSkyShotBuff(caster)) || checkLOS(caster.position, target));
    }

    const isAlly = entity => entity.type === 'wizard' || entity.type === 'monk';

    function canTarget(target, spell) {
      if (spell?.isGlobal) {
        const caster = activeEntity();
        return !!caster && caster.spells.includes(spell) && keyOf(target) === keyOf(caster.position);
      }
      // Доступность клетки не зависит от наличия существа: эффект
      // определяется отдельно при касте (в том числе лечение в пустоту).
      return inSpellReach(target, spell);
    }

    function highlightSpellRange(center = null) {
      clearHighlight();
      const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
      if (!spell) return;
      // Зелёный фон — допустимые центры; голубая обводка — зона удара.
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
        if (!canTarget({ x, y }, spell)) continue;
        const cell = cells[y * SIZE + x];
        // Дальность одинакова для всех заклинаний; размер зоны задаёт aoeSize.
        cell.classList.add('spell-range');
        rangeHighlightedCells.push(cell);
      }
      if (center && canTarget(center, spell)) {
        const area = affectedCells(center, spell, activeEntity(), entities, obstacles, terrain, keyOf, SIZE);
        for (const point of area) {
          const cell = cells[point.y * SIZE + point.x];
          cell.classList.add('spell-aoe');
          highlightedCells.push(cell);
        }
        showEffectPreview(area, spell, center);
      }
    }

    function showEffectPreview(area, spell, center = area[0]) {
      // Бейдж нужен только для урона; дальность и зона подсвечиваются отдельно.
      if (!(spell.damage > 0)) return;
      const keys = new Set(area.map(keyOf));
      const primary = spell.isSparks ? entities.find(entity => keyOf(entity.position) === keyOf(center)) : null;
      for (const entity of entities) {
        if (entity.hp <= 0 || !keys.has(keyOf(entity.position))) continue;
        if (spell.enemyOnly && isAlly(entity)) continue;
        // Защита учитывается как в настоящем уроне; текущий HP не ограничивает превью.
        const badge = document.createElement('span');
        badge.className = 'effect-preview damage';
        const previewSpell = spell.isSparks && entity !== primary ? { ...spell, damage: Math.floor(spell.damage / 2) } : spell;
        badge.textContent = `-${spellDamage(previewSpell, entity)}`;
        cells[entity.position.y * SIZE + entity.position.x].appendChild(badge);
        effectBadges.push(badge);
      }
    }

    function cancelSpell() {
      preparedSpellId = null;
      clearHighlight();
      updatePanel();
    }

    function playHealAnimation(cell) {
      // Каждый каст владеет своим набором частиц и отдельным таймером очистки.
      const sparks = [];
      for (let i = 0; i < 5; i++) {
        const spark = document.createElement('span');
        spark.className = 'heal-spark';
        spark.textContent = '+';
        spark.setAttribute('aria-hidden', 'true');
        // Оставляем место справа под ширину символа даже в маленькой клетке.
        spark.style.left = `${Math.random() * Math.max(0, cell.clientWidth - 12)}px`;
        spark.style.animationDelay = `${Math.random() * 100}ms`;
        cell.appendChild(spark);
        sparks.push(spark);
      }
      setTimeout(() => sparks.forEach(spark => spark.remove()), 600);
    }

    function playProjectileAnimation(fromCell, toCell, type = 'fire', onArrival = null) {
      const from = fromCell.getBoundingClientRect();
      const to = toCell.getBoundingClientRect();
      const isCube = type === 'fire-cube';
      const duration = isCube ? 350 : type === 'spark' ? 220 : type === 'spark-bounce' ? 180 : 250;
      const size = Math.min(from.width, from.height) * (isCube ? .65 : type === 'spark-bounce' ? .3 : .5);
      const projectile = document.createElement('span');
      projectile.className = 'spell-projectile';
      projectile.dataset.type = type;
      projectile.setAttribute('aria-hidden', 'true');
      projectile.innerHTML = type.startsWith('spark')
        ? WIZARD_SPELLS.find(spell => spell.id === 'sparks').svg
        : type === 'ice'
        ? WIZARD_SPELLS.find(spell => spell.id === 'ice-arrow').svg
        : `<svg viewBox="0 0 40 40"><path d="M20 2 Q24 14 32 17 Q40 29 28 36 Q10 43 6 29 Q3 20 13 12 L12 24 Q22 19 20 2" fill="#f65a25"/><path d="M22 17 Q35 34 21 35 Q11 34 15 25 L19 28 Z" fill="#ffdc36"/></svg>`;
      projectile.style.width = projectile.style.height = `${size}px`;
      projectile.style.left = `${from.left + from.width / 2 + window.scrollX - size / 2}px`;
      projectile.style.top = `${from.top + from.height / 2 + window.scrollY - size / 2}px`;
      document.body.appendChild(projectile);
      // Анимация в экранных координатах: прямая между центрами, без шагов сетки.
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const flight = projectile.animate([
        { transform: 'translate(0, 0)' },
        { transform: `translate(${dx}px, ${dy}px)` }
      ], { duration, easing: 'linear', fill: 'forwards' });
      let arrived = false;
      function finishFlight() {
        // Событие окончания и страховочный таймер не дублируют взрыв.
        if (arrived) return;
        arrived = true;
        projectile.remove();
        if (onArrival) onArrival();
      }
      flight.onfinish = finishFlight;
      // Страховочная очистка, даже если браузер приостановил отрисовку.
      setTimeout(finishFlight, duration + 50);
    }

    function playSparksAnimation(fromCell, primaryCell, sparkCells, onArrival, onPrimaryImpact) {
      playProjectileAnimation(fromCell, primaryCell, 'spark', () => {
        // Без существа в точке каста или при промахе цепь заканчивается без отскоков.
        if (!onPrimaryImpact()) { onArrival(); return; }
        if (!sparkCells.length) { setTimeout(onArrival, 180); return; }
        let pending = sparkCells.length;
        for (const cell of sparkCells) {
          playProjectileAnimation(primaryCell, cell, 'spark-bounce', () => {
            if (--pending === 0) onArrival();
          });
        }
      });
    }

    function playCubeExplosion(centerCell, spell) {
      const center = { x: Number(centerCell.dataset.x), y: Number(centerCell.dataset.y) };
      const flashes = [];
      // Зона берётся из той же функции, что и для урона, включая обрезку краёв.
      for (const point of affectedCells(center, spell, activeEntity(), entities, obstacles, terrain, keyOf, SIZE)) {
        const flash = document.createElement('span');
        flash.className = 'cube-explosion';
        flash.setAttribute('aria-hidden', 'true');
        cells[point.y * SIZE + point.x].appendChild(flash);
        flashes.push(flash);
      }
      setTimeout(() => flashes.forEach(flash => flash.remove()), 500);
    }

    function playArmageddonAnimation(water = false) {
      const rain = document.createElement('div');
      rain.className = `armageddon-rain${water ? ' water' : ''}`;
      rain.setAttribute('aria-hidden', 'true');
      // Плотная сетка из 320 капель покрывает всё поле без крупных пробелов.
      // Разброс внутри каждого участка не даёт дождю выглядеть строем.
      const columns = 20, rows = 16;
      for (let i = 0; i < columns * rows; i++) {
        const drop = document.createElement('span');
        drop.className = 'armageddon-drop';
        drop.style.left = `${((i % columns) + .15 + Math.random() * .7) * 100 / columns}%`;
        drop.style.top = `${(Math.floor(i / columns) + .15 + Math.random() * .7) * 100 / rows}%`;
        drop.style.animationDelay = `${Math.random() * 100}ms`;
        rain.appendChild(drop);
      }
      battlefield.appendChild(rain);
      setTimeout(() => rain.remove(), 900);
    }

    function playRainAnimation(center, spell) {
      const area = affectedCells(center, spell, activeEntity(), entities, obstacles, terrain, keyOf, SIZE);
      const layers = [];
      for (const point of area) {
        const cell = cells[point.y * SIZE + point.x];
        const { width, height } = cell.getBoundingClientRect();
        const layer = document.createElement('span');
        layer.className = 'rain-cell';
        layer.setAttribute('aria-hidden', 'true');
        layer.style.setProperty('--rain-distance', `${height * 1.5}px`);
        // Отдельный обрезающий слой удерживает капли внутри каждой клетки АОЕ.
        for (let i = 0; i < 3; i++) {
          const drop = document.createElement('span');
          drop.className = 'rain-drop';
          drop.style.left = `${Math.random() * Math.max(0, width - 3)}px`;
          drop.style.top = `${-35 - Math.random() * 10}%`;
          drop.style.animationDelay = `${Math.random() * 150}ms`;
          layer.appendChild(drop);
        }
        cell.appendChild(layer);
        layers.push(layer);
      }
      setTimeout(() => layers.forEach(layer => layer.remove()), 900);
    }

    function elementalShieldEffects(entity, damageType) {
      // Без типа возвращаем все защиты для панели, тика и снятия при смерти.
      return entity.elementalShields.filter(effect => effect.turnsLeft > 0
        && (damageType === undefined || effect.damageType === damageType));
    }

    function storeElementalShields(entity, effects) {
      entity.elementalShields = effects;
    }

    function addElementalShield(entity, spell, caster = activeEntity()) {
      const effects = elementalShieldEffects(entity);
      const fresh = { damageType: spell.damageType, amount: spell.shieldAmount, turnsLeft: spell.shieldDuration, sourceId: spell.id,
        casterId: caster?.id, casterName: caster?.name ?? 'Неизвестно', name: spell.name,
        svg: spell.svg, appliedOrder: ++effectOrder };
      const index = effects.findIndex(effect => effect.sourceId === spell.id);
      if (index === -1) effects.push(fresh);
      else effects[index] = fresh; // Тот же источник заменяется даже более слабой защитой.
      storeElementalShields(entity, effects);
    }

    function elementalBlockAmount(entity, damageType) {
      return elementalShieldEffects(entity, damageType).reduce((sum, effect) => sum + effect.amount, 0);
    }

    function isMagicalDamage(damageType) {
      return !['physical', 'poison', 'pure'].includes(damageType);
    }

    function damageBreakdown(spell, entity) {
      if (isFrozen(entity)) return { absorbed: 0, hpDamage: 0 };
      // Учитываем защиту нужного типа (включая physical) один раз, до ES/HP.
      const resistance = getEffectiveStat(entity, spell.damageType === 'physical' ? 'physical' : `resistances.${spell.damageType}`);
      const afterResistance = Math.max(0, spell.damage - resistance);
      const absorbed = isMagicalDamage(spell.damageType)
        ? Math.min(getCurrentES(entity), afterResistance) : 0;
      return { absorbed, hpDamage: afterResistance - absorbed };
    }

    function spellDamage(spell, entity) {
      // Превью не расходует ES и не бросает уклонение; показывает HP-урон при попадании.
      return damageBreakdown(spell, entity).hpDamage;
    }

    function applyDamage(spell, entity) {
      if (isFrozen(entity)) return; // Не расходуем ни HP, ни ES, ни бонусы защиты.
      const { absorbed, hpDamage } = damageBreakdown(spell, entity);
      consumeES(entity, absorbed);
      entity.hp = Math.max(0, entity.hp - hpDamage);
    }

    function shotHits(caster, target) {
      const hitChance = Math.max(0, Math.min(100, getEffectiveStat(caster, 'acc') - getEffectiveStat(target, 'eva')));
      return Math.random() * 100 < hitChance;
    }

    function playMissAnimation(cell) {

    function playSkyShotAnimation(cell, spell) {

    function playWeaknessVigorAnimation(cell, ally) {

    function playHeavyAnimation(cell) {
      const impact = document.createElement('span');

    function playStateAnimation(cell, stateId) {
      if (stateId === 'freeze') { playFreezeAnimation(cell); return; }
      if (stateId === 'heavy') { playHeavyAnimation(cell); return; }
      if (stateId === 'adrenaline') {
        const pulse = document.createElement('span');

        pulse.setAttribute('aria-hidden', 'true');
        pulse.innerHTML = ADRENALINE.icon;
        cell.appendChild(pulse);
        setTimeout(() => pulse.remove(), 500);
        return;
      }
      const animation = document.createElement('span');
      animation.className = `state-animation ${stateId === 'speed' ? 'wind' : 'mud'}`;
      animation.setAttribute('aria-hidden', 'true');
      animation.innerHTML = stateId === 'speed'
        ? `<svg viewBox="0 0 40 40"><path d="M1 10 H29 Q38 10 33 5 M4 21 H33 Q40 21 35 28 M1 32 H23 Q30 32 26 36" fill="none" stroke="#c3ffff" stroke-width="2" stroke-linecap="round"/></svg>`
        : `<svg viewBox="0 0 40 40"><ellipse cx="20" cy="25" rx="17" ry="10" fill="#86552c" fill-opacity=".6"/><g fill="none" stroke="#c6a06a" stroke-width="2"><ellipse cx="20" cy="25" rx="12" ry="7"/><ellipse cx="20" cy="25" rx="5" ry="3"/></g></svg>`;
      cell.appendChild(animation);
      setTimeout(() => animation.remove(), 500);
    }

    function playLightFlashAnimation(cell) {
      const flash = document.createElement('span');
      flash.className = 'light-flash';
      flash.setAttribute('aria-hidden', 'true');
      flash.innerHTML = MONK_SPELLS.find(spell => spell.id === 'light-flash').svg;
      cell.appendChild(flash);
      setTimeout(() => flash.remove(), 400);

    function playMembraneAnimation(cell) {
      const bubble = document.createElement('span');
      bubble.className = 'membrane-animation';
      bubble.setAttribute('aria-hidden', 'true');

    function playBurningHandsAnimation(centerCell, direction) {
      const origin = { x: Number(centerCell.dataset.x), y: Number(centerCell.dataset.y) };
      const cone = getConeCells(origin, direction, SIZE);
      const blocked = getBlockedConeCells(cone, direction, entities, obstacles, keyOf);
      const flames = [];
      for (const point of cone) {
        if (blocked.has(keyOf(point))) continue;
        const flame = document.createElement('span');
        flame.className = 'burning-hands-flame';
        flame.setAttribute('aria-hidden', 'true');
        flame.style.animationDelay = `${point.depth * 40}ms`;
        cells[point.y * SIZE + point.x].appendChild(flame);
        flames.push(flame);
      }
      setTimeout(() => flames.forEach(flame => flame.remove()), 500);

    function playWindRoseAnimation(centerCell) {

      gust.className = 'state-animation wind-rose';

      centerCell.appendChild(gust);
      setTimeout(() => gust.remove(), 500);
    }

    // Только эффект: ресурсы уже оплачены в первой фазе каста.
    function applySpellEffect(spell, target, caster, sparkTargets = null, shotHit = null) {
      const directTarget = entities.find(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target));
      // Пустая клетка — допустимый выстрел, но без урона, состояния и броска уклонения.
      if (spell.isShot && !directTarget) return;
      // Один бросок по основной цели; Искры передают уже полученный в анимации результат.
      if (spell.isShot && directTarget && !(shotHit ?? shotHits(caster, directTarget))) {
        // Общая точка промаха, включая готовый результат Искр: надпись появляется один раз.
        playMissAnimation(cells[target.y * SIZE + target.x]);
        return;
      }
      if (spell.isWeaknessVigor) {
        // Общие правила иммунитета, снятия Слабости и обновления срока остаются в applyState.
        if (directTarget) applyState(directTarget, {
          id: isAlly(directTarget) ? 'vigor' : 'weakness', duration: spell.stateDuration,
          casterId: caster.id, casterName: caster.name
        });
      } else if (spell.isSkyShot) {
        if (directTarget && isAlly(directTarget)) applySpellOnEntity(directTarget, {
          id: spell.id, name: spell.name, icon: spell.svg, isSkyShot: true,
          description: spell.effectDescription, duration: spell.effectDuration,
          casterId: caster.id, casterName: caster.name
        });
      } else if (spell.isSparks) {
        if (directTarget) {
          // Выбираем отскоки до урона: смерть основной цели не меняет уже выбранную цепь.
          const targets = sparkTargets ?? findSparkTargets(directTarget, spell.sparkRadius, spell.sparkCount, entities);
          applyDamage(spell, directTarget);
          for (const secondary of targets) {
            if (secondary.hp > 0) applyDamage({ damage: Math.floor(spell.damage / 2), damageType: spell.damageType }, secondary);
          }
        }
      } else if (spell.id === 'ice-arrow') {
        if (directTarget) {
          // Сначала сопротивление → ES → HP, затем Охлаждение у выжившей цели.
          // Общая проверка попадания выше не допускает состояния при промахе.
          applyDamage(spell, directTarget);
          if (directTarget.hp > 0) applyState(directTarget, {
            id: spell.stateId, duration: spell.stateDuration, casterId: caster.id, casterName: caster.name
          });
        }
      } else if (spell.isWindRose) {
        // Принудительное перемещение: не расходуем MP и не запускаем очередь шагов.
        for (const direction of [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }]) {
          const source = { x: target.x + direction.x, y: target.y + direction.y };
          const destination = { x: target.x + 2 * direction.x, y: target.y + 2 * direction.y };
          const victim = entities.find(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(source));
          // Тяжесть блокирует только толчок: обычная ходьба остаётся доступной.
          if (!victim || victim.states.some(state => state.id === 'heavy' && !state.suppressed
            && (state.duration > 0 || state.permanent || state.innate)) || destination.x < 0 || destination.x >= SIZE || destination.y < 0 || destination.y >= SIZE
            || obstacles.get(keyOf(destination)) === 'crate' || terrain.get(keyOf(destination)) === 'deep-water'
            || entities.some(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(destination))) continue;
          victim.position = destination;
        }
        renderPosition();
      } else if (spell.isRain) {
        // Влага действует на всех живых существ в квадрате, включая самого кастера.
        const area = new Set(affectedCells(target, spell, caster, entities, obstacles, terrain, keyOf, SIZE).map(keyOf));
        for (const victim of entities) {
          if (victim.hp > 0 && area.has(keyOf(victim.position))) applyState(victim, {
            id: spell.stateId, duration: spell.stateDuration, casterId: caster.id, casterName: caster.name
          });
        }
      } else if (spell.isMembrane) {
        if (directTarget && isAlly(directTarget)) applySpellOnEntity(directTarget, {
          id: spell.id, sourceId: spell.id, name: spell.name, icon: spell.svg, stackable: spell.stackable,
          duration: spell.effectDuration, casterId: caster.id, casterName: caster.name,
          esAmount: spell.esAmount, evaAmount: spell.evaAmount,
          description: `+${spell.esAmount} ES, +${spell.evaAmount} EVA`
        });
      } else if (spell.stateId) {
        const recipient = entities.find(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target)
          && (!spell.allyOnly || isAlly(entity)) && (!spell.enemyOnly || !isAlly(entity)));
        if (recipient) applySpellOnEntity(recipient, {
          id: spell.id, sourceId: spell.id, name: spell.name, icon: spell.svg,
          description: stateTypes.get(spell.stateId).name,
          duration: spell.effectDuration, casterId: caster.id, casterName: caster.name,
          stateId: spell.stateId, stateDuration: spell.stateDuration, stackable: spell.stackable
        });
      } else if (spell.isElementalShield) {
        const ally = entities.find(entity => entity.hp > 0 && isAlly(entity)
          && keyOf(entity.position) === keyOf(target));
        if (ally) addElementalShield(ally, spell, caster);
      } else if (spell.isHeal) {
        const ally = entities.find(entity => entity.hp > 0 && isAlly(entity)
          && keyOf(entity.position) === keyOf(target));
        if (ally) ally.hp = Math.min(ally.maxHP ?? ally.hp, ally.hp + spell.healAmount);
      } else {
        const area = new Set(affectedCells(target, spell, caster, entities, obstacles, terrain, keyOf, SIZE).map(keyOf));
        for (const victim of entities) {
          if (area.has(keyOf(victim.position)) && (spell.isAOE || victim.id !== caster.id)
            && (!spell.enemyOnly || !isAlly(victim))) {
            applyDamage(spell, victim);
            if (spell.id === 'burning-hands') {
              // Сначала урон: Влага и Заморозка ещё защищают от текущего удара.
              // Затем прямое снятие у всех задетых целей, даже при поглощении/иммунитете.
              // Заблокированные клетки сюда не попадают; нейтрализацию не вызываем.
              victim.states = victim.states.filter(state => !['wet', 'chill', 'freeze'].includes(state.id));
              resolveStateSuppression(victim);
              recalculateStateStats(victim);
            }
            // Горение по-прежнему накладывают заклинания с burnDuration (например, куб).
            if (spell.burnDuration && victim.hp > 0) applyState(victim, {
              id: 'burning', duration: spell.burnDuration, casterId: caster.id, casterName: caster.name
            });
          }
        }
      }
    }

    function castSpell(targetCell) {
      if (isCasting) return false;
      const target = { x: Number(targetCell.dataset.x), y: Number(targetCell.dataset.y) };
      const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
      if (!canPrepareSpell(spell) || !canTarget(target, spell)) return false;
      // Лечение и защита требуют живого союзника до оплаты.
      if ((spell.isHeal || spell.isElementalShield || spell.isMembrane || spell.isSkyShot) && !entities.some(entity => entity.hp > 0 && isAlly(entity)
        && keyOf(entity.position) === keyOf(target))) return false;
      if (spell.stateId && !spell.isRain && !spell.isShot && !entities.some(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target)
        && (!spell.allyOnly || isAlly(entity)) && (!spell.enemyOnly || !isAlly(entity)))) return false;
      if (spell.enemyOnly && !entities.some(entity => entity.hp > 0 && !isAlly(entity)
        && keyOf(entity.position) === keyOf(target))) return false;
      if (spell.isWeaknessVigor && !entities.some(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target))) return false;
      const caster = activeEntity();
      const primaryTarget = spell.isSparks ? entities.find(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target)) : null;
      // Этот же снимок целей используется для анимации и последующего урона.
      const sparkTargets = spell.isSparks ? findSparkTargets(primaryTarget, spell.sparkRadius, spell.sparkCount, entities) : null;
      let shotHit = null; // Для Искр один результат используется и анимацией, и уроном.
      const fromCell = cells[caster.position.y * SIZE + caster.position.x];

      // Фаза 1: фиксируем цель, оплачиваем каст и блокируем любые новые действия.
      caster.ap -= spell.apCost;
      spell.usesThisTurn++;
      if (spell.maxUsesPerBattle !== undefined) spell.usesTotal++;
      spell.cooldown = spell.maxCooldown;
      // Расходуем бафф только после успешной проверки цели и оплаты, даже при будущем промахе.
      // Срок и смерть источника обслуживаются общим механизмом spellsOnMe.
      if (spell.isShot) caster.spellsOnMe = caster.spellsOnMe.filter(effect => !effect.isSkyShot);
      isCasting = true;
      cancelSpell(); // Также очищает превью и обновляет disabled у кнопок.

      function finishCast() {
        // Фаза 2: HP и очередь меняются лишь после завершения анимации.
        applySpellEffect(spell, target, caster, sparkTargets, shotHit);
        removeDefeatedEntities();
        // Обновление UI выполнится сразу после callback, уже со снятой блокировкой.
        queueMicrotask(updatePanel);
        isCasting = false;
      }

      if (spell.isWeaknessVigor) {
        const recipient = entities.find(entity => entity.hp > 0 && keyOf(entity.position) === keyOf(target));
        playWeaknessVigorAnimation(targetCell, isAlly(recipient));
        setTimeout(finishCast, 500);
      } else if (spell.isSkyShot) {
        playSkyShotAnimation(targetCell, spell);
        setTimeout(finishCast, 500);
      } else if (spell.isSparks) {
        const sparkCells = sparkTargets.map(entity => cells[entity.position.y * SIZE + entity.position.x]);
        playSparksAnimation(fromCell, targetCell, sparkCells, () => setTimeout(finishCast, 0), () => {
          if (!primaryTarget) return false; // Выстрел в пустоту: без броска и отскоков.
          shotHit = shotHits(caster, primaryTarget);
          return shotHit;
        });
      } else if (spell.id === 'ice-arrow') {
        playProjectileAnimation(fromCell, targetCell, 'ice', () => setTimeout(finishCast, 0));
      } else if (spell.isCone) {
        playBurningHandsAnimation(fromCell, { x: target.x - caster.position.x, y: target.y - caster.position.y });
        setTimeout(finishCast, 500);
      } else if (spell.isWindRose) {
        playWindRoseAnimation(targetCell);
        setTimeout(finishCast, 500);
      } else if (spell.isRain) {
        playRainAnimation(target, spell);
        setTimeout(finishCast, 900);
      } else if (spell.isGlobal) {
        playArmageddonAnimation();
        setTimeout(finishCast, 900);
      } else if (spell.isMembrane) {
        playMembraneAnimation(targetCell);
        setTimeout(finishCast, 500);
      } else if (spell.id === 'light-flash') {
        playLightFlashAnimation(targetCell);
        setTimeout(finishCast, 400);
      } else if (spell.stateId) {
        playStateAnimation(targetCell, spell.stateId);
        setTimeout(finishCast, 500);
      } else if (spell.isElementalShield) {
        playElementalShieldAnimation(targetCell, spell);
        setTimeout(finishCast, 500);
      } else if (spell.isHeal) {
        playHealAnimation(targetCell);
        // 500 мс плюс до 100 мс случайной задержки последнего плюсика.
        setTimeout(finishCast, 600);
      } else if (spell.id === 'fire-cube') {
        playProjectileAnimation(fromCell, targetCell, 'fire-cube', () => {
          playCubeExplosion(targetCell, spell);
          // 350 мс полёта + 400 мс взрыва; отсчёт от реального прибытия.
          setTimeout(finishCast, 400);
        });
      } else {
        playProjectileAnimation(fromCell, targetCell, 'fire', () => setTimeout(finishCast, 0));
      }
      return true;
    }

    function removeDefeatedEntities() {
      const activeIndex = entities.findIndex(entity => entity.id === activeEntityId);
      const activeDied = activeIndex !== -1 && entities[activeIndex].hp <= 0;
      // Удаляем именно сущность по ID: одинаковые имена не связывают врагов.
      for (let i = entities.length - 1; i >= 0; i--) {
        const entity = entities[i];

        removeCasterEffects(entity.id);
        entity.svg.remove();
        turnSlots.get(entity.id).remove();
        turnSlots.delete(entity.id);
        if (selectedEntityId === entity.id) selectedEntityId = null;
        if (hoveredEntityId === entity.id) hoveredEntityId = null;
        if (fieldHoveredEntityId === entity.id) fieldHoveredEntityId = null;
        if (queueHoveredEntityId === entity.id) queueHoveredEntityId = null;
        entities.splice(i, 1);
      }
      if (activeDied || entities.length === 0) {
        isMoving = false;
        stepQueue = [];
        battlefield.classList.remove('moving');
        beginTurn(nextLivingEntity(activeEntityId)); // Смена активного участника происходит сразу.
      } else {
        updatePanel();
      }
    }

    function buildPath(start, target) {
      if (!isFree(start) || !isFree(target)) return null;
      const heuristic = (point) => Math.abs(point.x - target.x) + Math.abs(point.y - target.y);
      const open = [{ ...start, g: 0, h: heuristic(start), parent: null, axis: null, turn: 0 }];
      const bestCost = new Map([[keyOf(start), 0]]);
      const directions = [[1, 0], [0, 1], [-1, 0], [0, -1]];

      // A*: g учитывает вход на поверхность, h — Манхэттен (минимальная цена шага 1).
      // Чередование осей влияет только на выбор среди равных оценок,
      // поэтому не мешает находить кратчайшие обходные маршруты.
      while (open.length > 0) {
        open.sort((a, b) => (a.g + a.h) - (b.g + b.h) || a.h - b.h || a.turn - b.turn);
        const current = open.shift();
        if (current.g !== bestCost.get(keyOf(current))) continue;
        if (current.x === target.x && current.y === target.y) {
          const path = [];
          for (let node = current; node.parent; node = node.parent) {
            path.push({ x: node.x, y: node.y });
          }
          return path.reverse();
        }
        for (const [dx, dy] of directions) {
          const next = { x: current.x + dx, y: current.y + dy };
          if (!isFree(next)) continue;
          const g = current.g + entryCost(next);
          if (g >= (bestCost.get(keyOf(next)) ?? Infinity)) continue;
          bestCost.set(keyOf(next), g);
          const axis = dx ? 'x' : 'y';
          open.push({ ...next, g, h: heuristic(next), parent: current, axis,
            turn: axis === current.axis ? 1 : 0 });
        }
      }
      return null; // Свободная цель может быть отрезана препятствиями.
    }

    function showEffectTooltip(icon, effect, kind = 'spell') {
      hideEffectTooltip();
      const tooltip = document.createElement('div');

      const title = document.createElement('strong');
      title.className = 'effect-title';
      title.textContent = effect.name ?? icon.getAttribute('aria-label') ?? 'Эффект';
      tooltip.appendChild(title);
      const n = kind === 'state' ? effect.duration : (effect.duration ?? effect.turnsLeft);
      const word = n % 10 === 1 && n % 100 !== 11 ? 'ход' :
        n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14) ? 'хода' : 'ходов';
      // Для защиты выводим силу именно наложенного эффекта, а не шаблона заклинания.
      const spellDescription = effect.amount !== undefined
        ? effect.damageType === 'physical' ? `Блокирует ${effect.amount} ед. физического урона`
          : `Блокирует ${effect.amount} ед. урона стихии ${{ fire: 'огня', water: 'воды', earth: 'земли', air: 'воздуха' }[effect.damageType]}` : effect.description;
      const weaknessLocked = kind === 'state' && effect.id === 'weakness' && entities.some(entity =>
        entity.states.includes(effect) && hasActiveState(entity, 'adrenaline-crash'));
      const lines = kind === 'state'
        ? [effect.description, `Длительность: ${n} ${word}`,
          ...(effect.innate ? ['Врождённое'] : []), ...(effect.permanent ? ['Перманентное'] : []), ...(effect.unremovable || weaknessLocked ? [effect.id === 'weakness' ? 'Неснимаемая' : 'Неснимаемое'] : [])]
        : [spellDescription, `Длительность: ${n} ${word}${effect.isSkyShot ? ' или до первого применения' : ''}`,
          `Источник: ${effect.casterName ?? 'Неизвестно'}`];
      for (const text of lines) {
        const line = document.createElement('p');
        line.textContent = text;
        tooltip.appendChild(line);
      }
      document.body.appendChild(tooltip);
      // Сначала пробуем сбоку от иконки, на узком экране — снизу или сверху.
      const r = icon.getBoundingClientRect(), t = tooltip.getBoundingClientRect();
      let left, top;
      if (r.left - t.width >= 16) { left = r.left - t.width - 8; top = r.top; }
      else if (r.right + t.width + 16 <= innerWidth) { left = r.right + 8; top = r.top; }
      else { left = r.left; top = r.bottom + 8 + t.height <= innerHeight - 8 ? r.bottom + 8 : r.top - t.height - 8; }
      tooltip.style.left = `${scrollX + Math.max(8, Math.min(left, innerWidth - t.width - 8))}px`;
      tooltip.style.top = `${scrollY + Math.max(8, Math.min(top, innerHeight - t.height - 8))}px`;
      effectTooltip = tooltip;
    }
    window.addEventListener('resize', hideEffectTooltip);
    window.addEventListener('scroll', hideEffectTooltip);

    function renderEffectPanel() {
      const entity = entities.find(item => item.id === selectedEntityId);
      if (!entity) return;
      const effects = [...elementalShieldEffects(entity), ...entity.spellsOnMe]
        .sort((a, b) => (a.appliedOrder ?? 0) - (b.appliedOrder ?? 0));
      const key = JSON.stringify([entity.id, effects, entity.states]);
      // Не пересоздаём иконки на каждом mousemove: тултип остаётся стабильным.
      if (effectPanelKey === key) return;
      effectPanelKey = key;
      hideEffectTooltip();
      const spellEffects = document.getElementById('spell-effects');
      spellEffects.replaceChildren();
      const stateEffects = document.getElementById('state-effects');
      stateEffects.replaceChildren();
      for (const { effect, kind } of [
        ...effects.filter(item => item.sourceId).map(effect => ({ effect, kind: 'spell' })),
        ...entity.states.filter(state => !state.suppressed).map(effect => ({ effect, kind: 'state' }))
      ]) {
        const icon = document.createElement('button');
        icon.type = 'button';
        icon.className = 'spell-slot effect-icon';
        const sourceSpell = entities.flatMap(item => item.spells).find(item => item.id === effect.sourceId);
        const svg = effect.icon ?? effect.svg ?? sourceSpell?.svg;
        if (svg) icon.innerHTML = svg;
        else icon.textContent = '?';
        icon.setAttribute('aria-label', effect.name ?? sourceSpell?.name ?? effect.sourceId);
        icon.addEventListener('mouseenter', () => showEffectTooltip(icon, effect, kind));
        icon.addEventListener('mouseleave', hideEffectTooltip);
        icon.addEventListener('focus', () => showEffectTooltip(icon, effect, kind));
        icon.addEventListener('blur', hideEffectTooltip);
        (kind === 'state' ? stateEffects : spellEffects).appendChild(icon);
      }
    }

    function selectEntity(id) {
      if (!entities.some(entity => entity.id === id && entity.hp > 0)) return;
      selectedEntityId = id;
      updatePanel();
    }
    document.getElementById('close-effects').addEventListener('click', () => {
      selectedEntityId = null;
      updatePanel();
    });
    battlefield.addEventListener('contextmenu', event => {
      event.preventDefault();
      const cell = event.target.closest('.cell');
      if (!cell || !battlefield.contains(cell)) return;
      const entity = entities.find(item => item.hp > 0 && item.position.x === Number(cell.dataset.x)
        && item.position.y === Number(cell.dataset.y));
      if (entity) selectEntity(entity.id);
    });

    function getEffectiveStat(entity, statName) {
      if (!entity) return 0;
      if (statName === 'es') return getCurrentES(entity);
      const valueAt = object => statName.split('.').reduce((value, key) => value?.[key], object);
      const base = valueAt(entity.attributes) ?? 0;
      // Не берём entity.initiative: там уже есть бонус, который иначе учёлся бы дважды.
      const effects = [
        ...entity.states.filter(state => !state.suppressed && (state.duration > 0 || state.permanent || state.innate)),
        ...entity.spellsOnMe.filter(effect => effect.duration > 0 && !effect.suppressed),
        ...elementalShieldEffects(entity)
      ];
      // Физическая и стихийные защиты добавляются только к своей характеристике.
      const elementalProtection = statName === 'physical' ? elementalBlockAmount(entity, 'physical')
        : statName.startsWith('resistances.')
        ? elementalBlockAmount(entity, statName.split('.')[1]) : 0;
      const temporaryEvasion = statName === 'eva'
        ? entity.evaBonuses.filter(bonus => bonus.turnsLeft > 0).reduce((sum, bonus) => sum + bonus.amount, 0) : 0;
      return base + elementalProtection + temporaryEvasion + effects.reduce((sum, effect) => sum + (valueAt(effect.modifiers)
        ?? (statName === 'ini' ? effect.initiativeBonus ?? 0 : statName === 'eva' ? effect.evaBonus ?? 0 : 0)), 0);
    }

    function updatePanel() {
      hoveredEntityId = queueHoveredEntityId ?? fieldHoveredEntityId;
      if (selectedEntityId !== null && !entities.some(entity => entity.id === selectedEntityId)) selectedEntityId = null;
      const displayed = entities.find(entity => entity.id === (selectedEntityId ?? hoveredEntityId ?? activeEntityId));
      const viewingEffects = selectedEntityId !== null;
      if (viewingEffects) hideSpellTooltip();
      const pages = getSpellPages();
      const hasSpells = pages.some(page => page.length > 0);
      document.getElementById('spells').hidden = viewingEffects || !hasSpells;
      spellPageControls.hidden = viewingEffects || !hasSpells;
      previousSpellPageButton.disabled = nextSpellPageButton.disabled = pages.length < 2 || isCasting || isMoving;
      document.getElementById('effects-panel').hidden = !viewingEffects;
      if (viewingEffects) renderEffectPanel();
      else { effectPanelKey = null; hideEffectTooltip(); }
      document.getElementById('character-name').textContent = displayed?.name ?? '—';
      document.getElementById('hp').textContent = displayed ? `HP: ${displayed.hp} / ${displayed.maxHP}` : '—';
      document.getElementById('ap').textContent = displayed ? `AP: ${displayed.ap} / ${displayed.maxAP}` : '—';
      document.getElementById('mp').textContent = displayed ? `MP: ${displayed.mp} / ${displayed.maxMP}` : '—';
      const attributes = displayed?.attributes;
      const writeAttribute = (id, text) => { document.getElementById(id).textContent = attributes ? text : '—'; };
      for (const key of ['ra', 'vs', 'es', 'vit', 'str', 'att', 'int', 'wis', 'cha', 'luc', 'ini']) {
        writeAttribute(key, `${key.toUpperCase()}: ${getEffectiveStat(displayed, key)}`);
      }
      writeAttribute('wp', `WP: ${getEffectiveStat(displayed, 'wp')} / ${getEffectiveStat(displayed, 'maxWP')}`);
      writeAttribute('acc', `ACC: ${getEffectiveStat(displayed, 'acc')}%`);
      writeAttribute('eva', `EVA: ${getEffectiveStat(displayed, 'eva')}% / ${attributes?.eva}`);
      writeAttribute('blo', `BLO: ${getEffectiveStat(displayed, 'blo')}% / ${getEffectiveStat(displayed, 'blo')}`);
      for (const [key, label] of Object.entries({ ac: 'Броня', physical: 'Физика', fire: 'Огонь', water: 'Вода', air: 'Воздух', earth: 'Земля', mind: 'Разум', poison: 'Яд' })) {
        const id = key === 'ac' ? 'ac' : `res-${key}`;
        // Броня и Физика — отдельные характеристики; физические защиты входят в physical.
        const value = getEffectiveStat(displayed, key === 'ac' || key === 'physical' ? key : `resistances.${key}`);
        writeAttribute(id, String(value));
        document.getElementById(id).parentElement.setAttribute('aria-label', attributes ? `${label}: ${value}` : `${label}: —`);
      }
      endTurnButton.disabled = !displayed || isMoving || isCasting || isSkippingTurn || isFrozen(activeEntity()) || ![character.id, monk.id].includes(activeEntityId);
      // Характеристики учитывают наведение, заклинания — только активного участника.
      for (const spell of activeEntity()?.spells ?? []) {
        const slot = spellSlots.get(spell);
        if (!slot) continue; // Доступность обновляем только у слотов открытой страницы.
        slot.disabled = !displayed || isCasting || !canPrepareSpell(spell);
        slot.classList.toggle('prepared', activeEntity()?.spells.includes(spell) && preparedSpellId === spell.id);
        slot.setAttribute('aria-pressed', activeEntity()?.spells.includes(spell) && preparedSpellId === spell.id ? 'true' : 'false');
      }
      for (const cell of cells) cell.classList.remove('entity-hover');
      for (const entity of entities) {
        const active = entity.id === activeEntityId;
        turnSlots.get(entity.id).classList.toggle('active', active);
        turnSlots.get(entity.id).setAttribute('aria-current', active ? 'true' : 'false');
        if (queueHoveredEntityId === entity.id) {
          cells[entity.position.y * SIZE + entity.position.x].classList.add('entity-hover');
        }
      }
    }

    // Будущие действия используют эту проверку, чтобы не уйти в минус.
    function spendAP(amount) {
      if (isSkippingTurn || isFrozen(activeEntity()) || isCasting || isMoving || activeEntityId !== character.id || !Number.isInteger(amount) || amount < 0 || amount > character.ap) return false;
      character.ap -= amount;
      updatePanel();
      return true;
    }

    function beginTurn(entity) {
      isSkippingTurn = false;
      // Если участник удалён, выбираем следующего живого по фиксированной очереди.
      if (entities.indexOf(entity) === -1) {
        entity = nextLivingEntity(activeEntityId);
      }
      const version = ++turnVersion;
      preparedSpellId = null;
      if (!entity) {
        activeEntityId = null;
        renderSpellPanel();
        clearHighlight();
        updatePanel();
        return;
      }
      // Урон Горения срабатывает только у цели, без отсчёта длительности.
      // При самоналожении сохраняем урон до истечения защит/ES и самого Горения.
      // Активируем получателя хода заранее, чтобы его смерть сразу передала ход после него.
      activeEntityId = entity.id;
      const burning = entity.states.find(state => state.id === 'burning' && !state.suppressed
        && (state.duration > 0 || state.permanent || state.innate));
      if (burning) {
        applyDamage({ damage: burning.tickDamage, damageType: burning.damageType }, entity);
        if (entity.hp <= 0) {
          removeDefeatedEntities();
          return;
        }
      }
      // Проверяем ДО тика: последний ход самоналоженной Заморозки тоже пропускается.
      isSkippingTurn = entity.type === 'wolf' || isFrozen(entity);
      // Длительности меняются только по casterId, один раз даже для caster = target.
      tickCasterEffects(entity.id);
      // Начало личного хода обновляет только заклинания этого участника.
      for (const spell of entity.spells) {
        spell.usesThisTurn = 0;
        spell.cooldown = Math.max(0, spell.cooldown - 1);
      }
      activeEntityId = entity.id;
      renderSpellPanel();
      entity.ap = entity.maxAP;
      entity.mp = entity.maxMP;
      clearHighlight();
      updatePanel(); // HP не является ресурсом хода.
      if (isSkippingTurn) {
        // Волк или замороженный участник виден 100 мс, но действовать не может.

        setTimeout(() => {
          // Смерть или новая передача уже завершили этот ход: старый таймер не действует.
          if (version !== turnVersion) return;
          const index = entities.indexOf(entity);
          if (index === -1) {
            beginTurn(nextLivingEntity(activeEntityId));
            return;
          }
          entity.ap = entity.maxAP;
          entity.mp = entity.maxMP;
          beginTurn(nextLivingEntity(entity.id));
        }, 100);
      }
    }

    endTurnButton.addEventListener('click', () => {
      if (isCasting || isSkippingTurn || isFrozen(activeEntity())) return;
      if (isMoving || ![character.id, monk.id].includes(activeEntityId)) return;
      beginTurn(nextLivingEntity(activeEntityId));
    });

    // Двигаться могут союзники; волки пока только пропускают ход.
    function activeMover() {
      if (isSkippingTurn) return undefined;
      return entities.find(entity => entity.id === activeEntityId && entity.hp > 0 && !isFrozen(entity)
        && (entity.type === 'wizard' || entity.type === 'monk'));
    }

    function takeStep() {
      if (isCasting) return;
      const mover = activeMover();
      if (!isMoving || !mover || stepQueue.length === 0) return;
      const next = stepQueue[0];
      if (entryCost(next) > mover.mp) {
        stepQueue = [];
        isMoving = false;
        battlefield.classList.remove('moving');
        updatePanel();
        return;
      }
      mover.position = stepQueue.shift();
      mover.mp -= entryCost(mover.position);
      renderPosition();
      if (stepQueue.length > 0) {
        setTimeout(takeStep, STEP_MS);
      } else {
        isMoving = false;
        battlefield.classList.remove('moving');
      }
      updatePanel();
    }

    battlefield.addEventListener('mousemove', (event) => {
      if (isCasting) return;
      const cell = event.target.closest('.cell');
      if (!cell || !battlefield.contains(cell)) {
        fieldHoveredEntityId = null;
        updatePanel();
        if (preparedSpellId) highlightSpellRange();
        else clearHighlight(); // В том числе при наведении на промежуток сетки.
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      fieldHoveredEntityId = entities.find(entity => keyOf(entity.position) === keyOf(target))?.id ?? null;
      updatePanel();
      const mover = activeMover();
      if (isMoving || !mover) return;
      if (preparedSpellId) {
        const spell = activeEntity()?.spells.find(item => item.id === preparedSpellId);
        if (spell) {
          const key = `spell:${keyOf(target)}`;
          if (previewKey !== key) {
            highlightSpellRange(canTarget(target, spell) ? target : null);
            previewKey = key;
          }
        }
        return;
      }
      // Повторные события в одной клетке не запускают A* заново.
      // Позиция и MP включены в ключ, чтобы не использовать устаревшее превью.
      const key = `${mover.id}:${keyOf(target)}:${keyOf(mover.position)}:${mover.mp}`;
      if (previewKey === key) return;
      clearHighlight();
      // Стоимость нужна только для свободного места назначения.
      // Даже свой персонаж занимает клетку: число под ним не показываем.
      if (!isFree(target) || entities.some(entity => keyOf(entity.position) === keyOf(target))) {
        previewKey = key;
        return;
      }
      const path = buildPath(mover.position, target);
      if (path) highlightPath(path, mover.mp);
      costLabel.textContent = path === null ? '∞' : String(pathCost(path));
      cell.appendChild(costLabel);
      previewKey = key;
    });

    battlefield.addEventListener('mouseleave', () => {
      if (preparedSpellId) highlightSpellRange();
      else clearHighlight();
      fieldHoveredEntityId = null;
      updatePanel();
    });

    battlefield.addEventListener('click', (event) => {
      if (isCasting) return;
      // Новая цель не прерывает уже начатый маршрут.
      const mover = activeMover();
      if (isMoving || !mover) return;
      const cell = event.target.closest('.cell');
      if (!cell || !battlefield.contains(cell)) return;
      if (preparedSpellId) {
        castSpell(cell);
        return;
      }
      const target = { x: Number(cell.dataset.x), y: Number(cell.dataset.y) };
      if (!isFree(target)) return;
      const path = buildPath(mover.position, target);
      // Недоступный маршрут игнорируем, сохраняя текущее превью.
      if (mover.mp <= 0 || path === null || pathCost(path) > mover.mp) return;
      if (path.length === 0) return;
      clearHighlight();
      fieldHoveredEntityId = null;
      stepQueue = path;
      isMoving = true;
      battlefield.classList.add('moving');
      updatePanel();
      setTimeout(takeStep, STEP_MS);
    });

    renderPosition();
    renderSpellPanel();
    updatePanel();
    // На мобильном остаток высоты отдаётся полю; длинная панель прокручивается сама.
    new ResizeObserver(([entry]) => {
      document.documentElement.style.setProperty('--panel-height', `${Math.ceil(entry.target.getBoundingClientRect().height)}px`);
    }).observe(document.querySelector('.panel'));
  </script>
</body>
</html>
